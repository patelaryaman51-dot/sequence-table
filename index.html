<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sequence Table</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700&display=swap');
    *{box-sizing:border-box}body{margin:0;background:#20140e;color:#f8efdc;font-family:Inter,system-ui,sans-serif;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}.wood{min-height:100vh;padding:28px;background:repeating-linear-gradient(105deg,#2c170f 0 5px,#351c11 6px 11px,#24130d 12px 18px);position:relative}.wood:before{content:"";inset:0;position:fixed;pointer-events:none;opacity:.22;background:radial-gradient(ellipse at center,transparent 30%,#050301 100%)}.hero,.setup,.lobby{max-width:920px;margin:8vh auto;text-align:center}.eyebrow{font:600 11px 'DM Mono';letter-spacing:.18em;color:#d2a758}.title{font:700 clamp(58px,12vw,140px) Fraunces,serif;margin:10px 0;letter-spacing:-.08em;text-shadow:0 4px 0 #3c210e,0 15px 30px #000}.subtitle{font:600 19px Fraunces,serif;color:#d8c7ac}.hero-board{height:245px;margin:48px auto 26px;max-width:690px;border:16px solid #77431f;border-radius:12px;box-shadow:0 12px 0 #321807,0 26px 45px #000;background:repeating-linear-gradient(90deg,transparent 0 53px,#d4bc8a 54px 55px),repeating-linear-gradient(0deg,transparent 0 42px,#d4bc8a 43px 44px),#176644;transform:perspective(700px) rotateX(9deg)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{border:1px solid #e9c879;background:#e5c074;color:#301b10;padding:13px 21px;border-radius:5px;font-weight:700;letter-spacing:.06em;box-shadow:0 3px 0 #8d642f;transition:.18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.dark{background:#2c1b11;color:#faefd7;border-color:#936c42}.panel{background:#223e2d;border:10px solid #76431e;box-shadow:0 7px 0 #311906,0 20px 40px #0009;border-radius:9px;padding:28px}.choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:28px 0}.choice{min-width:190px;padding:25px;border:1px solid #b58c50;border-radius:8px;background:#f5e9d0;color:#302116;font-family:Fraunces;font-size:23px}.choice.selected{outline:4px solid #e0b864;background:#fff7e8}.form-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.form-row input{padding:14px;border:0;border-radius:5px;min-width:230px}.avatar-picker{font-size:28px;letter-spacing:5px;margin:17px}.avatar-picker span{cursor:pointer}.lobby-code{font:700 42px 'DM Mono';letter-spacing:.13em;color:#e2ba62}.seats{max-width:520px;margin:22px auto;text-align:left}.seat{padding:12px 15px;background:#183222;margin:7px;border-radius:5px;border-left:5px solid var(--c)}.game{min-height:100vh;display:grid;grid-template-columns:190px minmax(620px,1fr) 210px;gap:17px;padding:18px;align-items:center}.players{display:grid;gap:10px}.player{background:#251911;border:1px solid #805d35;border-radius:7px;padding:11px;font-size:12px;box-shadow:0 5px 11px #0007}.player.active{outline:2px solid #e4bd65;transform:translateY(-2px)}.player strong{display:block;font-size:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}.center{display:flex;flex-direction:column;align-items:center;gap:14px}.turn{font:700 13px 'DM Mono';letter-spacing:.1em;color:#e9c97e}
    .board{width:min(76vw,780px);aspect-ratio:1;display:grid;grid-template-columns:repeat(10,1fr);border:15px solid #7b4823;border-radius:8px;overflow:hidden;box-shadow:0 8px 0 #351807,0 25px 40px #000; background:#e5d2a5}
    .cell{position:relative;display:grid;place-items:center;min-width:0;border-right:1px solid #9b835d;border-bottom:1px solid #9b835d;background:#ebddbc;color:#261a15;font:700 clamp(7px,1.1vw,13px) 'DM Mono'}.cell:nth-child(odd){background:#e4d1a8}.cell.free{background:#346546;color:#f0e4bd;font-size:8px}.cell.legal{box-shadow:inset 0 0 0 3px #e0b85e;cursor:pointer}.cell.locked{background:#e8ca87}.chip{width:78%;height:78%;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff8,transparent 15%),var(--c);border:2px solid #ffffff80;box-shadow:inset 0 -4px 2px #0004,0 3px 3px #0007;animation:land .26s ease-out}.side{background:#21160f;border:1px solid #76532c;border-radius:8px;padding:14px;font-size:12px}.stack{width:82px;height:110px;margin:10px auto;background:repeating-linear-gradient(135deg,#4b2d1e 0 4px,#c5a574 5px 8px);border:3px solid #d4b571;border-radius:6px;box-shadow:4px 4px 0 #110b07}.discard{background:#f6ead0;color:#351e14;display:grid;place-items:center;font:700 21px Fraunces}.history{max-height:155px;overflow:auto;color:#d4c2a2}.history p{margin:8px 0}.hand-area{grid-column:1/-1;display:flex;justify-content:center;min-height:145px;padding-top:3px}.hand{display:flex;align-items:end;padding:0 15px;overflow:auto;max-width:100%}
    .card{width:86px;height:122px;flex:0 0 86px;margin:0 -5px 0 0;border-radius:7px;background:#fbf1dc;color:#2d1a15;border:1px solid #c8ad7b;box-shadow:0 6px 10px #0008;padding:8px;font:700 17px 'DM Mono';display:flex;justify-content:space-between;flex-direction:column;transition:.18s; position: relative;}
    .card.red{color:#b83d35}.card.selected{transform:translateY(-17px);outline:3px solid #e2b85d}
    .card .tag{font:600 8px Inter;background:#634327;color:#fff1cf;padding:3px;border-radius:3px;text-align:center}
    .discard-btn{background:#d45a4f!important;color:#fff!important;cursor:pointer;border:none;pointer-events:auto;transition:.18s;z-index:2;position:relative}.discard-btn:hover{filter:brightness(1.2)}.note{font-size:11px;color:#cdbd9c}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2d20;color:#fff;padding:10px 16px;border-radius:5px;box-shadow:0 4px 15px #000}.victory{position:fixed;inset:0;background:#120b08c9;display:grid;place-items:center;z-index:4}.victory .panel{max-width:480px;text-align:center}.victory h1{font:700 64px Fraunces;margin:0;color:#e6bd5e}@keyframes land{0%{transform:scale(1.8) rotate(15deg);opacity:.2}100%{transform:scale(1)}}@media(max-width:950px){.game{grid-template-columns:1fr;padding:10px}.players{grid-template-columns:repeat(2,1fr);order:1}.center{order:2}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px;order:3}.hand-area{order:4}.board{width:min(95vw,730px)}.stack{width:55px;height:74px}.history{display:none}}@media(max-width:560px){.wood{padding:15px}.hero-board{height:160px}.game{gap:9px}.card{width:68px;height:96px;flex-basis:68px;font-size:14px}.player{padding:8px}.board{border-width:8px}.cell{font-size:7px}}
    @media(min-width:951px){
      body{background:#071d15!important}
      .wood{padding:20px 8vw 150px!important;background:radial-gradient(circle at 50% 0,#123a29 0,#071d15 48%,#04130d 100%)!important}
      .game{grid-template-columns:minmax(680px,1fr) 310px!important;grid-template-rows:minmax(620px,1fr) auto!important;gap:18px!important;max-width:1280px!important;margin:auto!important;align-items:stretch!important}
      .center{grid-column:1!important;grid-row:1!important;justify-content:center!important;position:relative!important;padding-top:56px!important}
      .turn{position:absolute!important;top:0!important;left:0!important;right:0!important;min-height:45px!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;padding:0 16px!important;background:#0b281d!important;border:1px solid #9f7f34!important;border-radius:9px!important;color:#f2d982!important}
      .turn:before{content:'SEQUENCE · DIGITAL TABLETOP EDITION'!important;margin-right:auto!important;font:700 17px Fraunces,serif!important;color:#faeed2!important}
      .board{width:min(100%,760px)!important;border:13px solid #563418!important;border-radius:17px!important;box-shadow:0 0 0 3px #b89035,0 16px 33px #000b!important}
      .cell{font-size:clamp(9px,1vw,14px)!important;border-color:#506847!important;background:#f5efd9!important}
      .cell:nth-child(odd){background:#fcf7e9!important}
      .cell.free{background:linear-gradient(145deg,#161d13,#6a421e)!important;color:#f7dc85!important;font-size:10px!important}
      .players{grid-column:2!important;grid-row:1!important;align-self:start!important;background:#0b281d!important;border:1px solid #7d6834!important;padding:12px!important;border-radius:9px!important;gap:8px!important}
      .players:before{content:'PLAYERS'!important;font:700 12px 'DM Mono'!important;letter-spacing:.12em!important;color:#e9d89d!important}
      .player{background:#0a1e16!important;border-color:#294d39!important;box-shadow:none!important;padding:10px!important}
      .side{grid-column:2!important;grid-row:1!important;align-self:end!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;background:#0b281d!important;border-color:#7d6834!important;padding:12px!important}
      .side .history{display:none!important}
      .hand-area{grid-column:1/-1!important;grid-row:2!important;min-height:132px!important;margin:0 -8vw -150px!important;padding:15px 7vw 10px!important;background:linear-gradient(90deg,#061b12,#173c2b 50%,#061b12)!important;border-top:1px solid #968141!important}
      .hand:before{content:'YOUR HAND'!important;align-self:flex-start!important;margin:4px 24px 0 0!important;font:700 14px Fraunces,serif!important;color:#f0dc9d!important;white-space:nowrap!important}
      .card{width:78px!important;height:108px!important;flex-basis:78px!important;margin-right:7px!important}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const app=document.querySelector('#app');
    const shareOrigin=location.hostname==='localhost'?'http://192.168.1.128:3100':location.origin;
    let state={screen:'home',mode:'individual',max:4,name:'',avatar:'🦊',room:null,player:null,game:null,selected:null};
    const avatars=['🦊','🐼','🐯','🦉','🐸','🦁'];
    
    function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
    async function api(url,data){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error);return j}
    
    function home(){app.innerHTML=`<main class="wood"><section class="hero"><div class="eyebrow">A MODERN TABLETOP CLASSIC</div><h1 class="title">SEQUENCE</h1><p class="subtitle">Classic Strategy. New Digital Experience.</p><div class="hero-board"></div><div class="actions"><button class="btn" onclick="setup()">PLAY</button><button class="btn dark" onclick="howto()">HOW TO PLAY</button><button class="btn dark" onclick="join()">JOIN GAME</button><button class="btn" onclick="setup()">CREATE GAME</button></div></section></main>`}
    function setup(){state.screen='setup';app.innerHTML=`<main class="wood"><section class="setup panel"><div class="eyebrow">SET THE TABLE</div><h2 class="subtitle">Choose your match</h2><div class="choices"><button class="choice ${state.mode==='individual'?'selected':''}" onclick="state.mode='individual';setup()">INDIVIDUAL</button><button class="choice ${state.mode==='team'?'selected':''}" onclick="state.mode='team';setup()">TEAM PLAY</button></div><div class="choices">${[2,3,4].map(n=>`<button class="choice ${state.max===n?'selected':''}" onclick="state.max=${n};setup()">${n} PLAYERS${n===4?'<small><br>RECOMMENDED</small>':''}</button>`).join('')}</div><div class="form-row"><input id="name" placeholder="Your name" value="${esc(state.name)}"><button class="btn" onclick="createGame()">CREATE ROOM</button></div><div class="avatar-picker">${avatars.map(a=>`<span onclick="state.avatar='${a}';setup()" style="opacity:${a===state.avatar?1:.35}">${a}</span>`).join('')}</div><button class="btn dark" onclick="home()">BACK</button></section></main>`}
    async function createGame(){state.name=document.querySelector('#name').value.trim()||'Host';try{let x=await api('/api/create',{mode:state.mode,max:state.max,name:state.name,avatar:state.avatar});state.room=x.room;state.player=x.player;lobby();connect()}catch(e){toast(e.message)}}
    function join(){app.innerHTML=`<main class="wood"><section class="setup panel"><h2 class="subtitle">Join a game room</h2><div class="form-row"><input id="code" placeholder="ROOM CODE"><input id="name" placeholder="Your name"><button class="btn" onclick="joinGame()">JOIN TABLE</button></div><div class="avatar-picker">${avatars.map(a=>`<span onclick="state.avatar='${a}';join()" style="opacity:${a===state.avatar?1:.35}">${a}</span>`).join('')}</div><button class="btn dark" onclick="home()">BACK</button></section></main>`}
    async function joinGame(){try{let x=await api('/api/join',{room:document.querySelector('#code').value,name:document.querySelector('#name').value||'Guest',avatar:state.avatar});state.room=x.room;state.player=x.player;lobby();connect()}catch(e){toast(e.message)}}
    
    function connect(){state.es?.close();state.es=new EventSource(`/events?player=${state.player}`);state.es.addEventListener('state',e=>{state.game=JSON.parse(e.data); if(state.game.started)game();else lobby()})}
    function lobby(){let g=state.game||{code:state.room,players:[],max:state.max,host:state.player};app.innerHTML=`<main class="wood"><section class="lobby panel"><div class="eyebrow">SEQUENCE TABLE</div><div class="lobby-code">${g.code}</div><p class="note">Share this room code, or copy the invite link.</p><div class="actions"><button class="btn dark" onclick="navigator.clipboard.writeText(shareOrigin+'/?room=${g.code}');toast('Invite link copied')">COPY INVITE LINK</button><button class="btn dark" onclick="navigator.clipboard.writeText('${g.code}');toast('Room code copied')">COPY CODE</button>${g.host===state.player?'<button class="btn" onclick="start()">START GAME</button>':''}</div><div class="seats">${Array.from({length:g.max},(_,i)=>{let p=g.players.find(q=>q.seat===i);return `<div class="seat" style="--c:${p?.color||'#6c6c6c'}">${p?`${p.avatar||'🦊'} <strong>${esc(p.name)}</strong> — Ready${p.id===g.host?' · HOST':''}`:`Seat ${i+1} — Waiting for player…`}</div>`}).join('')}</div><button class="btn dark" onclick="home()">LEAVE TABLE</button></section></main>`}
    
    async function start(){try{await api('/api/start',{room:state.room,player:state.player})}catch(e){toast(e.message)}}
    
    function cardDead(c,g){return !c.jack&&!g.board.some(x=>!x.corner&&!x.chip&&x.rank===c.rank&&x.suit===c.suit)}
    
    function game(){
        let g=state.game,me=g.me;if(!me)return;
        let mine=g.turn===me.id;
        let selected=me.hand.find(c=>c.id===state.selected);
        
        let legal=c=>{
            if(!selected||!mine)return false;
            if(selected.eye==='two')return !c.chip&&!c.corner;
            if(selected.eye==='one')return !!c.chip&&!c.locked.length&&c.chip!==me.id;
            return !c.chip&&!c.corner&&c.rank===selected.rank&&c.suit===selected.suit
        };
        
        app.innerHTML=`<main class="wood">
            <section class="game">
                <aside class="players">
                    ${g.players.map(p=>`<div class="player ${g.turn===p.id?'active':''}" style="--c:${p.color}"><span class="dot"></span><strong>${p.avatar||'🦊'} ${esc(p.name)}</strong>${p.handCount} cards · ${p.sequences} sequence${p.sequences===1?'':'s'}${g.turn===p.id?'<div class="note">CURRENT TURN</div>':''}</div>`).join('')}
                </aside>
                <div class="center">
                    <div class="turn">${mine?'YOUR TURN':`CURRENT TURN · ${esc(g.players.find(p=>p.id===g.turn)?.name||'')}`}${selected?` · ${selected.eye==='two'?'WILD — choose any space':selected.eye==='one'?'REMOVE OPPONENT CHIP':'CARD SELECTED'}`:''}</div>
                    <div class="board">
                        ${g.board.map(c=>`<div class="cell ${c.corner?'free':''} ${legal(c)?'legal':''} ${c.locked.length?'locked':''}" onclick="cell(${c.x},${c.y})">${c.chip?`<i class="chip" style="--c:${g.players.find(p=>p.id===c.chip)?.color}"></i>`:c.label||''}</div>`).join('')}
                    </div>
                </div>
                <aside class="side">
                    <div><div class="eyebrow">DRAW DECK</div><div class="stack"></div><div>${g.deckCount} cards remaining</div></div>
                    <div><div class="eyebrow">DISCARD PILE</div><div class="stack discard">${g.discard?.label||'—'}</div></div>
                    <div class="history"><div class="eyebrow">MOVE HISTORY</div>${g.history.map(h=>`<p>${esc(h.text)}</p>`).join('')}</div>
                </aside>
                <div class="hand-area">
                    <div class="hand">
                        ${me.hand.map(c=>`
                            <div class="card ${['♥','♦'].includes(c.suit)?'red':''} ${state.selected===c.id?'selected':''}" onclick="select('${c.id}')" style="cursor:pointer; ${!mine?'opacity:0.55;pointer-events:none':''} ">
                                <span>${c.label}</span>
                                ${c.eye?`<span class="tag">${c.eye==='two'?'WILD JACK':'REMOVE JACK'}</span>`:cardDead(c,g)?`<button class="tag discard-btn" onclick="discardDead('${c.id}', event)">DISCARD DEAD</button>`:''}
                                <span style="align-self:end">${c.label}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </section>
            ${g.winner?`<div class="victory"><section class="panel"><div class="eyebrow">A WINNING LINE</div><h1>SEQUENCE!</h1><p class="subtitle">${esc(g.winner.name)} WINS</p><div class="actions"><button class="btn" onclick="home()">NEW GAME</button><button class="btn dark" onclick="lobby()">RETURN TO LOBBY</button></div></section></div>`:''}
        </main>`
    }
    
    function select(cardId){
        let c=state.game.me.hand.find(x=>x.id===cardId);
        if(state.selected===cardId){state.selected=null;game();return}
        state.selected=cardId;game();
    }
    
    async function discardDead(cardId, event){ 
        if(event) event.stopPropagation(); 
        try {
            await api('/api/action',{room:state.room,player:state.player,action:{type:'dead',cardId}});
            state.selected=null;
        } catch(e) { toast(e.message) } 
    }
    
    async function cell(x,y){
        let c=state.game.me.hand.find(x=>x.id===state.selected);
        if(!c)return;
        if(cardDead(c,state.game)){
            toast('Click the DISCARD DEAD button on the card in your hand.');
            return;
        }
        try {
            await api('/api/action',{room:state.room,player:state.player,action:{type:'play',cardId:c.id,x,y}});
            state.selected=null;
        } catch(e) { toast(e.message) }
    }
    
    function howto(){app.innerHTML=`<main class="wood"><section class="setup panel"><div class="eyebrow">HOW TO PLAY</div><h2 class="subtitle">Build five. Think ahead.</h2><div class="seats"><div class="seat" style="--c:#d5aa54"><strong>OBJECTIVE</strong> Make five connected chips across, down, or diagonally. Corners are free wild spaces.</div><div class="seat" style="--c:#d5aa54"><strong>TURNS</strong> Play a card, then place a chip on either matching space. Draw happens automatically.</div><div class="seat" style="--c:#d5aa54"><strong>JACKS</strong> Two-eyed Jacks place anywhere empty. One-eyed Jacks remove an unprotected opponent chip.</div><div class="seat" style="--c:#d5aa54"><strong>DEAD CARDS</strong> If both matching spaces are occupied, exchange the card once per turn, then take your turn.</div><div class="seat" style="--c:#d5aa54"><strong>WINNING</strong> Two players/teams need two sequences; three or four individual players need one.</div></div><button class="btn" onclick="home()">GOT IT</button></section></main>`}
    
    const roomParam=new URLSearchParams(location.search).get('room');
    if(roomParam){
        join();
        setTimeout(()=>document.querySelector('#code').value=roomParam,0)
    } else {
        home();
    }
  </script>
</body>
</html>
