<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Sequence - Sci-Fi Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
    
    :root {
        --bg-deep: #030705;
        --bg-panel: rgba(7, 18, 12, 0.85);
        --border-color: #103320;
        --neon-green: #00ff9d;
        --neon-green-dim: rgba(0, 255, 157, 0.2);
        --neon-red: #ff3333;
        --text-main: #d3efe0;
        --text-dim: #6b8f7d;
        --font-ui: 'Rajdhani', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }
    
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; min-width: 320px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    
    .scifi-bg { width: 100vw; height: 100vh; background: radial-gradient(circle at center, #05130a 0%, var(--bg-deep) 100%); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .scifi-bg::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px); background-size: 30px 30px; pointer-events: none; z-index: 0; }
    
    .menu-panel { position: relative; z-index: 10; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 40px; text-align: center; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px var(--neon-green-dim); backdrop-filter: blur(10px); }
    .eyebrow { font: 600 13px var(--font-mono); letter-spacing: 0.2em; color: var(--neon-green); margin-bottom: 10px; text-transform: uppercase; }
    .title { font: 700 clamp(40px, 8vw, 90px) var(--font-ui); margin: 0 0 10px 0; letter-spacing: 0.05em; color: #fff; text-shadow: 0 0 15px var(--neon-green); }
    .subtitle { font: 500 18px var(--font-ui); color: var(--text-dim); margin-bottom: 30px; }
    
    .actions { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
    .btn { background: rgba(0, 255, 157, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px 24px; border-radius: 4px; font: 600 16px var(--font-ui); letter-spacing: 0.1em; transition: 0.2s; text-transform: uppercase; }
    .btn:hover { background: var(--neon-green); color: var(--bg-deep); box-shadow: 0 0 15px var(--neon-green); transform: translateY(-2px); }
    .btn.dark { background: transparent; border-color: var(--text-dim); color: var(--text-main); }
    .btn.dark:hover { border-color: #fff; color: #fff; box-shadow: none; }
    
    .choices { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 20px 0; }
    .choice { min-width: 160px; padding: 20px; border: 1px solid var(--border-color); border-radius: 6px; background: rgba(0,0,0,0.5); color: var(--text-dim); font: 600 20px var(--font-ui); transition: 0.2s; }
    .choice.selected { border-color: var(--neon-green); color: var(--neon-green); background: rgba(0, 255, 157, 0.05); box-shadow: inset 0 0 10px var(--neon-green-dim); }
    
    .form-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .form-row input { padding: 12px 16px; border: 1px solid var(--border-color); background: #020403; color: #fff; border-radius: 4px; font-family: var(--font-mono); outline: none; }
    .form-row input:focus { border-color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green-dim); }
    
    .avatar-picker { font-size: 32px; margin: 25px 0; display: flex; justify-content: center; gap: 10px; }
    .avatar-picker span { cursor: pointer; transition: 0.2s; filter: grayscale(100%); opacity: 0.4; }
    .avatar-picker span.selected { filter: grayscale(0%); opacity: 1; transform: scale(1.2); }
    
    .lobby-code { font: 700 54px var(--font-mono); letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 20px var(--neon-green); margin: 20px 0; }
    .seats { max-width: 600px; margin: 30px auto; text-align: left; display: grid; gap: 10px; }
    .seat { padding: 15px 20px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); border-left: 4px solid var(--c); border-radius: 4px; font-family: var(--font-mono); display: flex; align-items: center; gap: 15px; }

    .hud-panel { position: absolute; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); backdrop-filter: blur(8px); padding: 15px; z-index: 10; }
    
    /* Top Right: Turn Indicator */
    .turn-hud { top: 25px; right: 25px; display: flex; align-items: center; gap: 12px; font: 700 16px var(--font-ui); letter-spacing: 0.1em; color: var(--text-dim); transition: 0.3s; border-right: 3px solid transparent; }
    .turn-hud.active { color: var(--neon-green); border-color: var(--neon-green); background: rgba(0, 255, 157, 0.05); box-shadow: 0 0 15px var(--neon-green-dim); }
    .speaker-icon { font-size: 18px; }
    
    /* Right Edge: Stats & Dead Pile */
    .right-hud { right: 25px; top: 50%; transform: translateY(-50%); width: 240px; display: flex; flex-direction: column; gap: 20px; }
    .player-stat { background: rgba(0,0,0,0.5); border: 1px solid #112217; padding: 12px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .player-stat.active { border-color: var(--neon-green); background: rgba(0, 255, 157, 0.05); }
    .player-stat .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    
    .dead-pile { text-align: center; padding: 20px 10px; background: rgba(0,0,0,0.7); border: 1px dashed var(--border-color); border-radius: 6px; }
    .stack { width: 70px; height: 100px; margin: 10px auto; background: repeating-linear-gradient(45deg, #0a110d 0 5px, #050a07 6px 10px); border: 1px solid #1a3324; border-radius: 4px; box-shadow: 2px 2px 0 rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; font: 700 24px var(--font-ui); color: #446655; }
    .stack.discard { background: #0e1812; color: var(--text-main); border-color: var(--border-color); }

    /* Bottom Left: Chat Box */
    .chat-hud { bottom: 25px; left: 25px; width: 280px; display: flex; flex-direction: column; gap: 10px; }
    .chat-log { height: 120px; overflow-y: auto; font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; justify-content: flex-end; }
    .chat-controls { display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); }
    .chat-input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13px; }
    .chat-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; transition: 0.2s; font-size: 16px; padding: 2px; }
    .chat-btn:hover { color: var(--neon-green); transform: scale(1.1); }

    .board-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; flex-direction: column; align-items: center; }
    .board { width: min(65vh, 65vw); max-width: 800px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(10, 1fr); border: 2px solid var(--neon-green); border-radius: 6px; background: #000; box-shadow: 0 0 40px rgba(0, 255, 157, 0.15), inset 0 0 20px rgba(0,0,0,0.8); overflow: hidden; }
    .cell { position: relative; display: grid; place-items: center; border-right: 1px solid #112217; border-bottom: 1px solid #112217; background: #080f0b; color: #3a5c48; font: 700 clamp(8px, 1.2vw, 16px) var(--font-mono); transition: 0.2s; }
    .cell:nth-child(odd) { background: #050a07; }
    .cell.free { background: #021a0f; color: var(--neon-green); font-size: clamp(6px, 1vw, 12px); font-family: var(--font-ui); letter-spacing: 0.1em; }
    
    /* Hover/Playable indicator - Subdued for clean visibility */
    .cell.legal:hover { background: rgba(0, 255, 157, 0.1); cursor: pointer; box-shadow: inset 0 0 0 1px var(--neon-green); color: var(--neon-green); }
    
    /* Neon Chips */
    .chip { width: 75%; height: 75%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, var(--c) 40%, #000 100%); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 12px var(--c), inset 0 -2px 5px rgba(0,0,0,0.6); animation: scanline 0.3s ease-out; }
    @keyframes scanline { 0% { transform: scale(1.5); opacity: 0; filter: brightness(2); } 100% { transform: scale(1); opacity: 1; filter: brightness(1); } }

    .hand-container { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 15; padding-bottom: 15px; }
    .hand { display: flex; gap: 10px; justify-content: center; }
    .card { width: clamp(70px, 8vw, 100px); height: clamp(100px, 11vw, 140px); background: #0b140f; border: 1px solid #1a3324; border-radius: 6px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: space-between; padding: 8px; font: 700 clamp(14px, 1.5vw, 20px) var(--font-mono); color: #a3c4b3; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; user-select: none; }
    .card.red { color: #ff4d4d; }
    
    .card:hover:not(:disabled) { transform: translateY(-10px); background: #111d16; border-color: #2a4d36; }
    .card.selected { transform: translateY(-20px); border-color: var(--neon-green); box-shadow: 0 0 20px var(--neon-green-dim); background: #0a1f14; color: #fff; }
    .card:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .card .corner-val { line-height: 1; }
    .card .corner-val.bottom { align-self: flex-end; transform: rotate(180deg); }
    
    /* Dead Card Button overlay */
    .tag { font: 600 10px var(--font-ui); background: rgba(0,0,0,0.8); color: var(--neon-green); padding: 4px; border-radius: 3px; text-align: center; letter-spacing: 0.05em; border: 1px solid #1a3324; }
    .discard-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; background: var(--neon-red); color: #fff; border: 1px solid #ffaaaa; padding: 6px 0; font: 700 12px var(--font-ui); border-radius: 4px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 51, 51, 0.6); z-index: 20; text-shadow: 0 1px 2px rgba(0,0,0,0.5); transition: 0.15s; }
    .discard-btn:hover { background: #ff4d4d; transform: translate(-50%, -50%) scale(1.05); }

    .toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: var(--bg-panel); color: #fff; padding: 12px 24px; border-radius: 4px; border: 1px solid var(--border-color); box-shadow: 0 5px 25px rgba(0,0,0,0.9); z-index: 100; font: 500 14px var(--font-ui); letter-spacing: 0.05em; }
    .victory-overlay { position: fixed; inset: 0; background: rgba(2, 6, 4, 0.9); z-index: 1000; display: grid; place-items: center; backdrop-filter: blur(10px); }
    
    @media (max-width: 1100px) {
        .right-hud, .chat-hud, .turn-hud { transform: scale(0.85); transform-origin: center right; }
        .chat-hud { transform-origin: bottom left; }
        .board { width: min(55vh, 75vw); }
    }
    @media (max-width: 768px) {
        .scifi-bg { display: block; overflow-y: auto; padding-top: 60px; }
        .board-container { position: relative; top: auto; left: auto; transform: none; padding: 20px; }
        .board { width: 100%; max-width: 90vw; margin: auto; }
        .right-hud, .chat-hud { position: relative; inset: auto; width: 100%; transform: none; flex-direction: row; flex-wrap: wrap; justify-content: center; margin: 10px 0; padding: 10px; }
        .chat-hud { display: none; /* Hide chat on mobile to save space */ }
        .hand-container { position: fixed; background: linear-gradient(0deg, var(--bg-deep) 70%, transparent); width: 100%; padding: 15px 10px 5px; }
        .dead-pile { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const app = document.querySelector('#app');
    const shareOrigin = location.hostname === 'localhost' ? 'http://192.168.1.128:3100' : location.origin;
    let state = { screen: 'home', mode: 'individual', max: 4, name: '', avatar: '🦊', room: null, player: null, game: null, selected: null };
    const avatars = ['🦊','🐼','🐯','🦉','🐸','🦁','🤖','👽'];
    
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    
    function toast(t) {
        document.querySelector('.toast')?.remove();
        let d = document.createElement('div');
        d.className = 'toast';
        d.innerHTML = `⚠️ ${esc(t)}`;
        document.body.append(d);
        setTimeout(() => d.remove(), 3000);
    }
    
    async function api(url, data) {
        let r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        let j = await r.json();
        if (!r.ok) throw Error(j.error);
        return j;
    }

    function home() {
        app.innerHTML = `
        <main class="scifi-bg">
            <section class="menu-panel">
                <div class="eyebrow">DIGITAL MULTIPLAYER TABLETOP</div>
                <h1 class="title">SEQUENCE</h1>
                <p class="subtitle">System connection established. Awaiting pilot input.</p>
                <div class="actions">
                    <button class="btn" onclick="setup()">INITIALIZE GAME</button>
                    <button class="btn dark" onclick="join()">JOIN SERVER</button>
                    <button class="btn dark" onclick="howto()">DATABANK (RULES)</button>
                </div>
            </section>
        </main>`;
    }
    
    function setup() {
        state.screen = 'setup';
        app.innerHTML = `
        <main class="scifi-bg">
            <section class="menu-panel">
                <div class="eyebrow">CONFIGURE MATCH PARAMETERS</div>
                <h2 class="subtitle">Select combat mode</h2>
                <div class="choices">
                    <button class="choice ${state.mode==='individual'?'selected':''}" onclick="state.mode='individual';setup()">INDIVIDUAL</button>
                    <button class="choice ${state.mode==='team'?'selected':''}" onclick="state.mode='team';setup()">SQUAD (TEAM)</button>
                </div>
                <div class="choices">
                    ${[2,3,4].map(n=>`<button class="choice ${state.max===n?'selected':''}" onclick="state.max=${n};setup()">${n} PLAYERS</button>`).join('')}
                </div>
                <div class="avatar-picker">
                    ${avatars.map(a=>`<span class="${a===state.avatar?'selected':''}" onclick="state.avatar='${a}';setup()">${a}</span>`).join('')}
                </div>
                <div class="form-row">
                    <input id="name" placeholder="Enter Callsign" value="${esc(state.name)}">
                    <button class="btn" onclick="createGame()">LAUNCH SERVER</button>
                </div>
                <div class="actions"><button class="btn dark" style="margin-top:20px" onclick="home()">ABORT</button></div>
            </section>
        </main>`;
    }
    
    async function createGame() {
        state.name = document.querySelector('#name').value.trim() || 'Pilot';
        try {
            let x = await api('/api/create', { mode: state.mode, max: state.max, name: state.name, avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }
    
    function join() {
        app.innerHTML = `
        <main class="scifi-bg">
            <section class="menu-panel">
                <div class="eyebrow">UPLINK CONNECTION</div>
                <h2 class="subtitle">Enter server coordinates</h2>
                <div class="avatar-picker">
                    ${avatars.map(a=>`<span class="${a===state.avatar?'selected':''}" onclick="state.avatar='${a}';join()">${a}</span>`).join('')}
                </div>
                <div class="form-row">
                    <input id="code" placeholder="SERVER CODE (e.g. A1B2C3)" style="text-transform:uppercase">
                    <input id="name" placeholder="Enter Callsign">
                    <button class="btn" onclick="joinGame()">CONNECT</button>
                </div>
                <div class="actions"><button class="btn dark" style="margin-top:20px" onclick="home()">ABORT</button></div>
            </section>
        </main>`;
    }
    
    async function joinGame() {
        try {
            let x = await api('/api/join', { room: document.querySelector('#code').value, name: document.querySelector('#name').value || 'Guest', avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }

    function connect() {
        state.es?.close();
        state.es = new EventSource(`/events?player=${state.player}`);
        state.es.addEventListener('state', e => {
            state.game = JSON.parse(e.data); 
            if(state.game.started) game(); else lobby();
        });
    }
    
    function lobby() {
        let g = state.game || { code: state.room, players: [], max: state.max, host: state.player };
        app.innerHTML = `
        <main class="scifi-bg">
            <section class="menu-panel">
                <div class="eyebrow">SERVER LOBBY</div>
                <div class="lobby-code">${g.code}</div>
                <p class="subtitle" style="font-size:14px">Transmit this code to other pilots to grant network access.</p>
                <div class="actions">
                    <button class="btn dark" onclick="navigator.clipboard.writeText(shareOrigin+'/?room=${g.code}');toast('Uplink copied to clipboard')">COPY UPLINK</button>
                    <button class="btn dark" onclick="navigator.clipboard.writeText('${g.code}');toast('Code copied to clipboard')">COPY CODE</button>
                    ${g.host === state.player ? '<button class="btn" onclick="start()">INITIATE SEQUENCE</button>' : ''}
                </div>
                <div class="seats">
                    ${Array.from({length: g.max}, (_, i) => {
                        let p = g.players.find(q => q.seat === i);
                        return `<div class="seat" style="--c:${p?.color || '#334433'}">${p ? `${p.avatar} <strong>${esc(p.name)}</strong> <span style="margin-left:auto;color:var(--text-dim)">${p.id===g.host?'HOST':'CONNECTED'}</span>` : `<span style="color:var(--border-color)">SLOT ${i+1} — AWAITING SIGNAL...</span>`}</div>`;
                    }).join('')}
                </div>
                <div class="actions"><button class="btn dark" style="margin-top:20px" onclick="home()">DISCONNECT</button></div>
            </section>
        </main>`;
    }
    
    async function start() {
        try { await api('/api/start', { room: state.room, player: state.player }); } catch(e) { toast(e.message); }
    }

    function cardDead(c, g) {
        // A card is dead if it is not a Jack AND there are no spaces on the board that are empty, not corners, and match the suit/rank.
        return !c.jack && !g.board.some(x => !x.corner && !x.chip && x.rank === c.rank && x.suit === c.suit);
    }
    
    function game() {
        let g = state.game, me = g.me;
        if (!me) return;
        let mine = g.turn === me.id;
        let selected = me.hand.find(c => c.id === state.selected);
        
        let legal = c => {
            if (!selected || !mine) return false;
            if (selected.eye === 'two') return !c.chip && !c.corner;
            if (selected.eye === 'one') return !!c.chip && !c.locked.length && c.chip !== me.id;
            return !c.chip && !c.corner && c.rank === selected.rank && c.suit === selected.suit;
        };
        
        app.innerHTML = `
        <main class="scifi-bg">
            
            <!-- TOP RIGHT: Turn Indicator -->
            <div class="hud-panel turn-hud ${mine ? 'active' : ''}">
                <div class="speaker-icon">${mine ? '🔊' : '🔈'}</div>
                <div>${mine ? 'YOUR TURN' : 'AWAITING: ' + esc(g.players.find(p => p.id === g.turn)?.name.toUpperCase() || '')}</div>
                ${selected ? `<div style="font-size:11px; margin-left:10px; padding-left:10px; border-left:1px solid #333;">${selected.eye==='two'?'TARGET ANY':'TARGET ENEMY'}</div>` : ''}
            </div>

            <!-- RIGHT EDGE: Stats & Dead Pile -->
            <aside class="hud-panel right-hud">
                <div class="eyebrow" style="margin:0">NETWORK STATUS</div>
                <div style="display:flex; flex-direction:column; gap:8px;">
                    ${g.players.map(p => `
                        <div class="player-stat ${g.turn === p.id ? 'active' : ''}" style="--c:${p.color}">
                            <div class="dot"></div>
                            <div style="flex-grow:1">
                                <strong>${p.avatar} ${esc(p.name)}</strong>
                                <div style="color:var(--text-dim); font-size:11px; margin-top:2px;">SEQ: ${p.sequences} | CARDS: ${p.handCount}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="dead-pile">
                    <div class="eyebrow">DEAD CARD PILE</div>
                    <div class="stack discard">${g.discard?.label || '—'}</div>
                    <div style="font-size:11px; color:var(--text-dim)">${g.deckCount} CARDS IN DECK</div>
                </div>
            </aside>
            
            <!-- BOTTOM LEFT: Chat Interface Shell -->
            <div class="hud-panel chat-hud">
                <div class="eyebrow">COMMS LINK</div>
                <div class="chat-log">
                    ${g.history.slice(-4).map(h => `<div style="margin-bottom:6px">> ${esc(h.text)}</div>`).join('')}
                </div>
                <div class="chat-controls">
                    <button class="chat-btn">😀</button>
                    <button class="chat-btn">👍</button>
                    <button class="chat-btn">🤯</button>
                    <div style="width:1px; height:15px; background:var(--border-color); margin:0 5px;"></div>
                    <button class="chat-btn">🔊</button>
                </div>
            </div>

            <!-- CENTER: Main Game Board -->
            <div class="board-container">
                <div class="board">
                    ${g.board.map(c => `
                        <div class="cell ${c.corner ? 'free' : ''} ${legal(c) ? 'legal' : ''}" onclick="cell(${c.x},${c.y})">
                            ${c.chip ? `<i class="chip" style="--c:${g.players.find(p=>p.id===c.chip)?.color}"></i>` : c.label || ''}
                        </div>
                    `).join('')}
                </div>
            </div>

            <!-- ABSOLUTE BOTTOM: Player Hand -->
            <div class="hand-container">
                <div class="hand">
                    ${me.hand.map(c => {
                        let isDead = cardDead(c, g);
                        return `
                        <button class="card ${['♥','♦'].includes(c.suit) ? 'red' : ''} ${state.selected === c.id ? 'selected' : ''}" onclick="select('${c.id}')" ${!mine && !isDead ? 'disabled' : ''}>
                            <span class="corner-val top">${c.label}</span>
                            
                            ${c.eye ? `<span class="tag">${c.eye==='two'?'WILD (ANY)':'SNIPE (ENEMY)'}</span>` : ''}
                            
                            <!-- DEAD CARD BUTTON -->
                            ${isDead ? `<div class="discard-btn" onclick="discardDead('${c.id}', event)">DISCARD DEAD</div>` : ''}
                            
                            <span class="corner-val bottom">${c.label}</span>
                        </button>
                    `}).join('')}
                </div>
            </div>

        </main>
        
        <!-- VICTORY SCREEN -->
        ${g.winner ? `
        <div class="victory-overlay">
            <section class="menu-panel" style="border-color:var(--neon-green)">
                <div class="eyebrow" style="color:#fff">SEQUENCE ACHIEVED</div>
                <h1 class="title" style="color:var(--neon-green)">VICTORY</h1>
                <p class="subtitle" style="color:#fff">${esc(g.winner.name)} HAS SECURED THE GRID.</p>
                <div class="actions">
                    <button class="btn" onclick="home()">NEW DEPLOYMENT</button>
                    <button class="btn dark" onclick="lobby()">RETURN TO LOBBY</button>
                </div>
            </section>
        </div>` : ''}
        `;
    }

    function select(cardId) {
        let c = state.game.me.hand.find(x => x.id === cardId);
        if (state.selected === cardId) { state.selected = null; game(); return; }
        state.selected = cardId;
        game();
    }
    
    // Explicit function for the bright red Dead Card discard button
    async function discardDead(cardId, event) {
        if (event) event.stopPropagation(); // Prevent the main card click from firing
        if (!state.game.me || state.game.turn !== state.game.me.id) {
            toast('Wait for your turn to exchange a dead card.');
            return;
        }
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'dead', cardId } });
            state.selected = null;
        } catch(e) { toast(e.message); }
    }
    
    async function cell(x, y) {
        let c = state.game.me.hand.find(x => x.id === state.selected);
        if (!c) return;
        if (cardDead(c, state.game)) {
            toast('Click the red DISCARD DEAD button on the card instead.');
            return;
        }
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'play', cardId: c.id, x, y } });
            state.selected = null;
        } catch(e) { toast(e.message); }
    }
    
    function howto() {
        app.innerHTML = `
        <main class="scifi-bg">
            <section class="menu-panel">
                <div class="eyebrow">DATABANK: MISSION OBJECTIVES</div>
                <h2 class="title" style="font-size:30px">HOW TO PLAY</h2>
                <div class="seats" style="font-size:14px; line-height:1.4">
                    <div class="seat" style="--c:var(--neon-green)"><strong>OBJECTIVE:</strong> Form lines of 5 marker chips (horizontal, vertical, diagonal). Corners act as free wild spaces for any player.</div>
                    <div class="seat" style="--c:var(--neon-green)"><strong>TURNS:</strong> Select a card from your hand, then tap an available matching space on the grid to deploy a chip. Draw is automatic.</div>
                    <div class="seat" style="--c:var(--neon-green)"><strong>JACKS:</strong> 2-Eyed Jacks deploy a chip on ANY empty space. 1-Eyed Jacks destroy an unprotected enemy chip.</div>
                    <div class="seat" style="--c:var(--neon-red)"><strong>DEAD CARDS:</strong> If both spaces for a standard card are occupied, it is "DEAD". A red discard button will appear. Click it during your turn to swap it, then take your normal turn.</div>
                </div>
                <div class="actions"><button class="btn" onclick="home()">ACKNOWLEDGE</button></div>
            </section>
        </main>`;
    }
    
    const roomParam = new URLSearchParams(location.search).get('room');
    if (roomParam) {
        join();
        setTimeout(() => document.querySelector('#code').value = roomParam.toUpperCase(), 0);
    } else {
        home();
    }
  </script>
</body>
</html>
