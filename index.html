<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sequence - Digital Tabletop</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap');
    
    :root {
        --bg-space: #020804;
        --circuit-glow: rgba(79, 209, 197, 0.05);
        --neon-teal: #4fd1c5;
        --neon-green: #38a169;
        --neon-red: #e53e3e;
        --panel-bg: rgba(6, 18, 14, 0.85);
        --panel-border: rgba(79, 209, 197, 0.25);
        --text-main: #e2e8f0;
        --text-muted: #718096;
        --font-ui: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }
    
    * { box-sizing: border-box; }
    
    body { 
        margin: 0; 
        background-color: var(--bg-space);
        background-image: 
            linear-gradient(var(--circuit-glow) 1px, transparent 1px),
            linear-gradient(90deg, var(--circuit-glow) 1px, transparent 1px);
        background-size: 50px 50px;
        color: var(--text-main); 
        font-family: var(--font-ui); 
        overflow: hidden; 
        height: 100vh;
        width: 100vw;
    }

    #app { width: 100%; height: 100%; position: relative; }

    .layout-container {
        display: grid;
        grid-template-columns: 320px 1fr 320px;
        height: 100vh;
        width: 100vw;
        padding: 80px 20px 20px 20px; 
        gap: 20px;
    }

    .left-col {
        display: flex;
        flex-direction: column;
        gap: 15px;
        height: 100%;
        overflow: hidden;
    }

    .center-col {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .right-col {
        display: flex;
        flex-direction: column;
        gap: 15px;
        height: 100%;
    }

    .header-banner {
        position: absolute;
        top: 15px; left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, rgba(6,18,14,0.95) 0%, rgba(10,30,22,0.95) 50%, rgba(6,18,14,0.95) 100%);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 12px 30px;
        display: flex;
        align-items: center;
        gap: 30px;
        box-shadow: 0 0 30px rgba(79, 209, 197, 0.1);
        z-index: 10;
        backdrop-filter: blur(10px);
    }
    .header-title { font-weight: 800; font-size: 15px; letter-spacing: 0.15em; color: #fff; text-transform: uppercase; }
    .header-invite { font-size: 11px; font-weight: 700; background: var(--neon-teal); color: #000; padding: 6px 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: none; text-transform: uppercase; }

    .status-panel {
        background: var(--panel-bg);
        border: 1px solid var(--neon-teal);
        border-radius: 16px;
        padding: 25px 20px;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: inset 0 0 20px rgba(79,209,197,0.1);
    }
    .status-title { font-weight: 800; font-size: 18px; color: var(--neon-teal); text-transform: uppercase; line-height: 1.4; }

    .players-panel { display: flex; flex-direction: column; gap: 10px; }
    .players-header { font-size: 12px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 5px; }
    .player-row {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 12px 16px;
        backdrop-filter: blur(10px);
    }
    .player-row.active { border-color: var(--neon-teal); box-shadow: inset 0 0 15px rgba(79,209,197,0.15); }
    .player-name { font-weight: 800; font-size: 15px; color: #fff; }
    .player-stats { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .current-turn-tag { font-size: 10px; font-weight: 800; color: var(--neon-teal); margin-top: 6px; letter-spacing: 0.1em; }

    .hand-panel {
        flex-grow: 1;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 15px;
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        overflow: hidden; 
        min-height: 0;
    }
    .hand-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 10px;
        flex-grow: 1;
        margin-top: 10px;
        min-height: 0;
    }
    
    .music-panel {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(10px);
        flex-shrink: 0;
    }
    .music-header { padding: 0 4px 10px 4px; font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }

    .chat-panel {
        height: 200px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(10px);
        overflow: hidden;
        flex-shrink: 0;
    }
    .chat-header { padding: 10px 14px; font-size: 11px; font-weight: 800; border-bottom: 1px solid var(--panel-border); color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .chat-messages { flex-grow: 1; overflow-y: auto; padding: 10px 14px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .chat-msg { color: #cbd5e1; }
    .chat-msg span { font-weight: 800; color: var(--neon-teal); }
    .chat-inputs { padding: 10px 14px; border-top: 1px solid var(--panel-border); background: rgba(0,0,0,0.4); }
    .emoji-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 16px; }
    .emoji-row span { cursor: pointer; transition: transform 0.1s; }
    .emoji-row span:hover { transform: scale(1.2); }
    .input-bar { display: flex; gap: 6px; }
    .chat-input { flex-grow: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px 10px; color: #fff; outline: none; font-size: 12px; }

    .dead-pile-panel {
        background: var(--panel-bg);
        border: 1px solid var(--neon-red);
        border-radius: 16px;
        padding: 15px;
        text-align: center;
        backdrop-filter: blur(10px);
        cursor: pointer;
        transition: 0.2s;
        margin-top: auto;
    }
    .dead-pile-panel:hover { box-shadow: 0 0 15px rgba(229, 62, 62, 0.3); }
    .dp-title { font-size: 12px; font-weight: 800; color: var(--neon-red); letter-spacing: 0.1em; margin-bottom: 10px; }
    .dp-box { border: 2px dashed #4a5568; border-radius: 8px; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); font-weight: 700; padding: 10px; }

    .board-container {
        height: 100%;
        max-height: 85vh;
        aspect-ratio: 1;
        background: #0f172a;
        border: 4px solid var(--neon-teal);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(79, 209, 197, 0.2);
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
        overflow: hidden;
    }
    
    .cell {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        border-right: 1px solid #1e293b;
        border-bottom: 1px solid #1e293b;
        background: #f8fafc;
        color: #0f172a;
        font: 800 clamp(10px, 1.8vh, 20px) var(--font-mono);
        transition: 0.2s;
    }
    .cell.red-suit { color: var(--neon-red); }
    .cell:nth-child(odd) { background: #ffffff; }
    .cell.free { background: var(--bg-space); color: var(--neon-teal); font-size: clamp(8px, 1.2vh, 12px); flex-direction: column; border: 1px solid var(--neon-teal); }
    .cell.free::after { content: 'FREE'; margin-top: 2px; }
    .cell.legal:hover { background: rgba(79, 209, 197, 0.25); cursor: pointer; box-shadow: inset 0 0 0 3px var(--neon-teal); z-index: 5; }
    
    .chip { 
        width: 75%; height: 75%; 
        border-radius: 50%; 
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, var(--c) 40%, #000000 100%); 
        border: 2px solid rgba(255,255,255,0.3); 
        box-shadow: 0 4px 10px rgba(0,0,0,0.6); 
        position: absolute; 
        z-index: 2;
    }

    .card {
        height: 100%; 
        width: 100%;
        background: #ffffff;
        color: #0f172a;
        border-radius: 6px;
        box-shadow: -2px 5px 10px rgba(0,0,0,0.5);
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 6px;
        font: 800 14px var(--font-mono);
        border: 2px solid transparent;
        transition: 0.2s;
        position: relative;
        cursor: pointer;
        min-height: 0;
        overflow: hidden;
    }
    .card.red { color: var(--neon-red); }
    .card.selected { transform: translateY(-5px) scale(1.02); border-color: var(--neon-teal); box-shadow: 0 0 20px rgba(79, 209, 197, 0.5); z-index: 5; }
    .card:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
    .card .tag { font: 800 8px var(--font-ui); background: #0f172a; color: #fff; padding: 4px 0; border-radius: 4px; text-align: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: grid; place-items: center; z-index: 1000; backdrop-filter: blur(10px); }
    .modal-card { background: var(--panel-bg); border: 1px solid var(--neon-teal); border-radius: 20px; padding: 40px; text-align: center; max-width: 500px; width: 90%; }
    .btn-primary { background: var(--neon-teal); color: #000; border: none; padding: 14px 28px; border-radius: 10px; font-weight: 800; font-size: 15px; width: 100%; margin-top: 12px; cursor: pointer; }
    .form-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--panel-border); border-radius: 8px; padding: 14px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); border: 1px solid var(--neon-teal); color: var(--text-main); padding: 14px 28px; border-radius: 12px; font-weight: 700; z-index: 2000; font-size: 14px; }

    .sequence-alert {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(6, 18, 14, 0.98);
        border: 3px solid var(--neon-teal);
        border-radius: 20px;
        padding: 30px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        z-index: 9999;
        animation: popIn 0.6s forwards;
        box-shadow: 0 0 50px rgba(79, 209, 197, 0.4);
    }
    .sequence-alert img { width: 220px; border-radius: 12px; }
    .sequence-alert .seq-name { font-size: 28px; font-weight: 800; color: var(--neon-teal); text-transform: uppercase; text-align: center; }
    @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const app = document.querySelector('#app');
    const shareOrigin = window.location.origin;
    let state = { screen: 'home', mode: 'individual', max: 4, name: '', avatar: '👽', room: null, player: null, game: null, selected: null };
    const avatars = ['👽','🤖','👾','👻','🦊','🐼'];
    let prevSequences = {};
    
    // RELIABLE GIPHY DIRECT LINKS FOR ANIMATIONS
    const SEQUENCE_GIF = "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif"; // Party/Celebration
    const WIN_GIF = "https://media.giphy.com/media/5Zesu5VP1lUe28a/giphy.gif"; // Funny Monkey
    
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function toast(t) {
        document.querySelector('.toast')?.remove();
        let d = document.createElement('div');
        d.className = 'toast';
        d.textContent = t;
        document.body.append(d);
        setTimeout(() => d.remove(), 3000);
    }
    
    async function api(url, data) {
        let r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        let j = await r.json();
        if (!r.ok) throw Error(j.error || 'Server request failed');
        return j;
    }

    function home() {
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-size: 12px; color: var(--neon-teal); letter-spacing: 0.2em; margin-bottom: 10px; font-weight: 800;">DIGITAL TABLETOP EDITION</div>
                <h1 style="font-size: 48px; margin: 0 0 24px 0; font-weight: 800; letter-spacing: 0.05em; font-family: var(--font-mono);">SEQUENCE</h1>
                <button class="btn-primary" onclick="setup()">CREATE GAME</button>
                <button class="btn-primary" style="background: transparent; border: 2px solid var(--neon-teal); color: var(--neon-teal);" onclick="join()">JOIN ROOM</button>
            </div>
        </div>`;
    }
    
    function setup() {
        state.screen = 'setup';
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <h2 style="margin-top:0; font-size:24px; font-weight: 800;">CONFIGURE MATCH</h2>
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
                    <button class="btn-primary" style="margin-top:0; padding:10px; background:${state.mode==='individual'?'var(--neon-teal)':'transparent'}; color:${state.mode==='individual'?'#000':'var(--text-main)'}; border:2px solid var(--neon-teal);" onclick="state.mode='individual'; setup()">INDIVIDUAL</button>
                    <button class="btn-primary" style="margin-top:0; padding:10px; background:${state.mode==='team'?'var(--neon-teal)':'transparent'}; color:${state.mode==='team'?'#000':'var(--text-main)'}; border:2px solid var(--neon-teal);" onclick="state.mode='team'; setup()">TEAM</button>
                    <button class="btn-primary" style="margin-top:0; padding:10px; background:${state.mode==='computer'?'var(--neon-teal)':'transparent'}; color:${state.mode==='computer'?'#000':'var(--text-main)'}; border:2px solid var(--neon-teal);" onclick="state.mode='computer'; setup()">VS COMPUTER</button>
                </div>
                ${state.mode !== 'computer' ? `
                <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;">
                    ${[2,3,4].map(n=>`<button class="btn-primary" style="margin-top:0; padding: 10px 0; background:${state.max===n?'var(--neon-teal)':'transparent'}; color:${state.max===n?'#000':'var(--text-main)'}; border:2px solid var(--neon-teal);" onclick="state.max=${n}; setup()">${n}P</button>`).join('')}
                </div>` : '<div style="margin-bottom: 24px; color: var(--text-muted); font-size:12px;">You will play 1v1 against AlphaBot.</div>'}
                <div style="display: flex; justify-content: center; gap: 15px; font-size: 32px; margin-bottom: 24px;">
                    ${avatars.map(a=>`<span style="cursor:pointer; opacity:${a===state.avatar?1:0.3}; transform:scale(${a===state.avatar?1.2:1}); transition:0.2s;" onclick="state.avatar='${a}'; setup()">${a}</span>`).join('')}
                </div>
                <input id="name" class="form-input" placeholder="Enter Callsign" value="${esc(state.name)}">
                <button class="btn-primary" onclick="createGame()">INITIALIZE TABLE</button>
            </div>
        </div>`;
    }
    
    async function createGame() {
        state.name = document.querySelector('#name').value.trim() || 'Player';
        try {
            let x = await api('/api/create', { mode: state.mode, max: state.max, name: state.name, avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }
    
    function join() {
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <h2 style="margin-top:0; font-size:24px; font-weight:800;">JOIN LINK</h2>
                <input id="code" class="form-input" style="text-transform:uppercase; font-family:var(--font-mono); font-size:20px; text-align:center; letter-spacing:0.1em;" placeholder="ROOM CODE">
                <input id="name" class="form-input" placeholder="Enter Callsign">
                <button class="btn-primary" onclick="joinGame()">CONNECT</button>
                <button class="btn-primary" style="background: transparent; border: 2px solid var(--neon-teal); color: var(--neon-teal);" onclick="home()">ABORT</button>
            </div>
        </div>`;
    }
    
    async function joinGame() {
        try {
            let x = await api('/api/join', { room: document.querySelector('#code').value, name: document.querySelector('#name').value || 'Guest', avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }

    function connect() {
        state.es?.close();
        state.es = new EventSource(`/events?player=${state.player}`);
        state.es.addEventListener('state', e => {
            state.game = JSON.parse(e.data);
            
            // Check for new sequences to show Shinchan GIF
            let newSeqName = null;
            if (state.game && state.game.started) {
                state.game.players.forEach(p => {
                    if (prevSequences[p.id] !== undefined && p.sequences > prevSequences[p.id]) {
                        newSeqName = state.game.mode === 'team' ? (p.seat % 2 ? 'RED TEAM' : 'BLUE TEAM') : p.name;
                    }
                    prevSequences[p.id] = p.sequences;
                });
                
                if (newSeqName && !state.game.winner) showSequenceAlert(newSeqName);
            }

            if (state.game.started) game(); else lobby();
        });
    }

    function showSequenceAlert(name) {
        document.querySelector('.sequence-alert')?.remove();
        const alert = document.createElement('div');
        alert.className = 'sequence-alert';
        alert.innerHTML = `
            <img src="${SEQUENCE_GIF}" alt="Sequence Celebration">
            <div class="seq-name">${esc(name)} GOT A SEQUENCE!</div>
        `;
        document.body.appendChild(alert);
        setTimeout(() => alert.remove(), 4500);
    }
    
    function lobby() {
        let g = state.game || { code: state.room, players: [], max: state.max, host: state.player };
        let inviteLink = shareOrigin + '/?room=' + g.code;
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-family:var(--font-mono); font-size:48px; font-weight:800; color:var(--neon-teal); margin-bottom:10px;">${g.code}</div>
                <p style="color:var(--text-muted); margin-bottom:24px;">Awaiting network connections...</p>
                
                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                    ${Array.from({length: g.max}, (_, i) => {
                        let p = g.players.find(q => q.seat === i);
                        return `<div style="background:rgba(0,0,0,0.6); padding:16px; border-radius:12px; border-left:4px solid ${p?.color||'#4a5568'}; text-align:left; font-size:15px; font-weight:700;">${p ? `${p.avatar} ${esc(p.name)}` : `Slot ${i+1} — Empty`}</div>`;
                    }).join('')}
                </div>
                
                <button class="btn-primary" style="background:transparent; border:2px solid var(--neon-teal); color:var(--neon-teal); margin-top:0; margin-bottom:16px;" onclick="navigator.clipboard.writeText('${inviteLink}');toast('Invite link copied!')">COPY ROOM LINK</button>
                ${g.host === state.player ? '<button class="btn-primary" style="margin-top:0;" onclick="start()">COMMENCE GAME</button>' : ''}
            </div>
        </div>`;
    }
    
    async function start() {
        try { await api('/api/start', { room: state.room, player: state.player }); } catch(e) { toast(e.message); }
    }

    function cardDead(c, g) {
        if(c.jack) return false;
        const spaces = g.board.filter(x => !x.corner && x.rank === c.rank && x.suit === c.suit);
        return spaces.length > 0 && spaces.every(x => x.chip !== null);
    }

    async function discardToDeadPile() {
        if (!state.selected) {
            toast("Click a dead card in your hand first!");
            return;
        }
        let c = state.game.me.hand.find(x => x.id === state.selected);
        if (!c) return;
        
        if (!cardDead(c, state.game)) {
            toast("That card is not dead! There are open spaces for it.");
            return;
        }

        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'dead', cardId: c.id } });
            state.selected = null;
            toast("Dead card exchanged! Make your normal move.");
        } catch(e) { toast(e.message); }
    }

    function sendChat() {
        let input = document.getElementById('chat-msg');
        if (input && input.value.trim() !== '') {
            let log = document.getElementById('chat-log');
            if (log) {
                log.innerHTML += `<div class="chat-msg"><span>${state.game.me.name}:</span> ${esc(input.value)}</div>`;
                log.scrollTop = log.scrollHeight;
            }
            input.value = '';
        }
    }
    
    function insertEmoji(emoji) {
        let input = document.getElementById('chat-msg');
        if(input) input.value += emoji;
    }

    function loadLocalAudio(event) {
        const file = event.target.files[0];
        if (file) {
            const audioPlayer = document.getElementById('local-audio-player');
            audioPlayer.src = URL.createObjectURL(file);
            audioPlayer.play();
        }
    }

    function game() {
        let g = state.game, me = g.me;
        if (!me) return;
        let mine = g.turn === me.id;
        let selected = me.hand.find(c => c.id === state.selected);
        let turnPlayer = g.players.find(p => p.id === g.turn) || { name: 'Someone' };
        let inviteLink = shareOrigin + '/?room=' + g.code;
        
        let legal = c => {
            if (!selected || !mine) return false;
            if (selected.eye === 'two') return !c.chip && !c.corner;
            if (selected.eye === 'one') return !!c.chip && !c.locked.length && c.chip !== me.id;
            return !c.chip && !c.corner && c.rank === selected.rank && c.suit === selected.suit;
        };
        
        app.innerHTML = `
        <div class="header-banner">
            <div class="header-title">SEQUENCE · DIGITAL TABLETOP</div>
            <div style="background: rgba(0,0,0,0.5); border: 1px solid var(--neon-teal); padding: 4px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px;">
                <span style="font-family: var(--font-mono); font-size: 12px; color: var(--neon-teal);">ROOM: ${g.code}</span>
                <button class="header-invite" onclick="navigator.clipboard.writeText('${inviteLink}');toast('Invite link copied!')">COPY LINK</button>
            </div>
        </div>

        <div class="layout-container">
            <!-- Left Side: Hand, Music, and Chat -->
            <div class="left-col">
                <div class="hand-panel">
                    <div style="width: 100%; font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.1em;">YOUR HAND</div>
                    <div class="hand-grid">
                        ${me.hand.map(c => {
                            let isRed = ['♥','♦'].includes(c.suit);
                            return `
                            <div class="card ${isRed ? 'red' : ''} ${state.selected === c.id ? 'selected' : ''}" onclick="select('${c.id}')" ${!mine ? 'disabled' : ''}>
                                <div style="line-height:1; text-align:left;">${c.label}</div>
                                ${c.eye ? `<div class="tag">${c.eye==='two'?'WILD':'REMOVE'}</div>` : ''}
                                <div style="line-height:1; align-self:flex-end; transform:rotate(180deg);">${c.label}</div>
                            </div>
                        `;}).join('')}
                    </div>
                </div>

                <!-- LOCAL MUSIC PLAYER SECTION -->
                <div class="music-panel">
                    <div class="music-header">CUSTOM BACKGROUND MUSIC</div>
                    <div style="display: flex; flex-direction: column; gap: 12px; justify-content: center; padding-top: 10px;">
                        <input type="file" accept="audio/*" onchange="loadLocalAudio(event)" style="font-size: 11px; color: var(--text-main); background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; border: 1px solid var(--panel-border); width: 100%; cursor: pointer;">
                        <audio id="local-audio-player" controls loop style="width: 100%; height: 35px; outline: none; border-radius: 20px;"></audio>
                    </div>
                </div>
                
                <div class="chat-panel">
                    <div class="chat-header">COMMS LINK</div>
                    <div class="chat-messages" id="chat-log">
                        ${g.history.slice(-8).map(h => `<div class="chat-msg">> ${esc(h.text)}</div>`).join('')}
                    </div>
                    <div class="chat-inputs">
                        <div class="emoji-row">
                            ${['😁','❤️','😍','😂','😊','🙏','👍'].map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('')}
                        </div>
                        <div class="input-bar">
                            <input id="chat-msg" class="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Side: The Main 10x10 Board -->
            <div class="center-col">
                <div class="board-container">
                    ${g.board.map(c => `
                        <div class="cell ${c.corner ? 'free' : ''} ${['♥','♦'].includes(c.suit) ? 'red-suit' : ''} ${legal(c) ? 'legal' : ''}" onclick="cell(${c.x},${c.y})">
                            ${c.chip ? `<i class="chip" style="--c:${g.players.find(p=>p.id===c.chip)?.color}"></i>` : c.label || ''}
                        </div>
                    `).join('')}
                </div>
            </div>

            <!-- Right Side: Turn Status, Players, and Dead Pile -->
            <div class="right-col">
                <div class="status-panel">
                    <div class="status-title">IT'S ${esc(turnPlayer.name).toUpperCase()}'S TURN!</div>
                </div>

                <div class="players-panel">
                    <div class="players-header">PLAYERS</div>
                    ${g.players.map(p => {
                        let pIcon = ['#d45a4f','#e53e3e'].includes(p.color) ? '♦' : '♠'; 
                        return `
                        <div class="player-row ${g.turn === p.id ? 'active' : ''}">
                            <div class="player-name" style="color:${p.color}">
                                <span class="player-icon">${pIcon}</span> ${esc(p.name)}
                            </div>
                            <div class="player-stats">${p.handCount} cards - ${p.sequences} sequences</div>
                            ${g.turn === p.id ? `<div class="current-turn-tag">CURRENT TURN</div>` : ''}
                        </div>
                    `;}).join('')}
                </div>

                <div class="dead-pile-panel" onclick="discardToDeadPile()">
                    <div class="dp-title">DEAD CARD PILE</div>
                    <div class="dp-box">
                        CLICK TO DISCARD<br>SELECTED DEAD CARD
                    </div>
                </div>
            </div>
        </div>

        ${g.winner ? `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-size: 12px; color: var(--neon-teal); font-weight: 800; letter-spacing: 0.2em; margin-bottom: 20px;">MATCH CONCLUDED</div>
                <!-- FUNNY MONKEY VICTORY GIF -->
                <img src="${WIN_GIF}" style="width:250px; border-radius:12px; margin: 0 auto 20px; display:block; border: 3px solid var(--neon-teal); box-shadow: 0 10px 30px rgba(0,0,0,0.5);" alt="Victory Monkey">
                <h1 style="font-size: 40px; margin: 0 0 15px 0; font-family: var(--font-mono); color: #fff;">${esc(g.winner.name)} WINS!</h1>
                <button class="btn-primary" onclick="home()">NEW MATCH</button>
            </div>
        </div>` : ''}
        `;
    }

    function select(cardId) {
        if (state.selected === cardId) { state.selected = null; game(); return; }
        state.selected = cardId;
        game();
    }
    
    async function cell(x, y) {
        let c = state.game.me.hand.find(x => x.id === state.selected);
        if (!c) return;
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'play', cardId: c.id, x, y } });
            state.selected = null;
        } catch(e) { toast(e.message); }
    }
    
    const roomParam = new URLSearchParams(location.search).get('room');
    if (roomParam) {
        join();
        setTimeout(() => document.querySelector('#code').value = roomParam.toUpperCase(), 0);
    } else {
        home();
    }
  </script>
</body>
</html>
