<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sequence - Digital Tabletop Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap');
    
    :root {
        --bg-main: #060911;
        --bg-card: #0f172a;
        --border-color: #1e293b;
        --accent-primary: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.25);
        --accent-danger: #ef4444;
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
        --font-ui: 'Outfit', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }
    
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-main); color: var(--text-main); font-family: var(--font-ui); overflow-x: hidden; user-select: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    
    /* Layout Framework */
    #app { width: 100vw; min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 30%, #0d1b32 0%, #060911 100%); }
    
    /* Header */
    .header { height: 65px; border-bottom: 1px solid var(--border-color); background: rgba(6, 9, 17, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: sticky; top: 0; z-index: 50; }
    .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.12em; color: #fff; display: flex; align-items: center; gap: 10px; }
    .brand span { color: var(--accent-primary); }
    .status-pill { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-primary); color: var(--accent-primary); padding: 5px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; font-family: var(--font-mono); box-shadow: 0 0 15px var(--accent-glow); }

    /* Main Workspace */
    .workspace { flex-grow: 1; display: grid; grid-template-columns: 300px 1fr 320px; gap: 24px; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; align-items: start; }
    @media(max-width: 1250px) { .workspace { grid-template-columns: 1fr; } }

    /* Left Sidebar: Comms & Logs */
    .sidebar-left { display: flex; flex-direction: column; gap: 20px; }
    .panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .panel-title { font-weight: 600; font-size: 12px; letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    
    .chat-box { height: 280px; display: flex; flex-direction: column; }
    .chat-messages { flex-grow: 1; overflow-y: auto; font-size: 13px; color: var(--text-dim); display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding-right: 4px; }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input { flex-grow: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; color: #fff; outline: none; font-size: 13px; }
    .chat-input:focus { border-color: var(--accent-primary); }
    .btn-icon { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-primary); color: var(--accent-primary); border-radius: 8px; padding: 0 12px; font-weight: bold; transition: 0.2s; }
    .btn-icon:hover { background: var(--accent-primary); color: #000; box-shadow: 0 0 10px var(--accent-glow); }

    /* Center Board Area */
    .center-area { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
    .board-container { width: 100%; max-width: 680px; aspect-ratio: 1; background: #04070d; border: 4px solid var(--border-color); border-radius: 16px; box-shadow: 0 15px 50px rgba(0,0,0,0.7); overflow: hidden; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
    
    .cell { position: relative; display: grid; place-items: center; border-right: 1px solid rgba(30, 41, 59, 0.4); border-bottom: 1px solid rgba(30, 41, 59, 0.4); background: #0a1120; color: var(--text-dim); font: 700 12px var(--font-mono); transition: 0.15s; }
    .cell:nth-child(odd) { background: #0d1628; }
    .cell.free { background: #17253b; color: var(--accent-primary); font-size: 11px; font-family: var(--font-ui); font-weight: 600; }
    .cell.legal:hover { background: rgba(56, 189, 248, 0.2); cursor: pointer; color: var(--accent-primary); box-shadow: inset 0 0 0 2px var(--accent-primary); }
    .chip { width: 74% !important; height: 74% !important; border-radius: 50% !important; background: radial-gradient(circle at 30% 30%, #fff 0%, var(--c) 50%, #000 100%) !important; border: 2px solid rgba(255,255,255,0.5) !important; box-shadow: 0 0 14px var(--c), inset 0 -2px 4px rgba(0,0,0,0.8) !important; display: block !important; position: absolute !important; }

    /* Right Sidebar */
    .sidebar-right { display: flex; flex-direction: column; gap: 20px; }
    .player-card { background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 10px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .player-card.active { border-color: var(--accent-primary); background: rgba(56, 189, 248, 0.08); box-shadow: 0 0 15px rgba(56,189,248,0.15); }
    .player-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }

    .piles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; }
    .stack-box { background: rgba(0,0,0,0.3); border: 1px dashed var(--border-color); border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
    .stack-val { font-size: 16px; font-weight: 700; color: #fff; margin-top: 6px; }

    /* Bottom Hand Dock */
    .hand-dock { position: sticky; bottom: 0; background: rgba(6, 9, 17, 0.95); border-top: 1px solid var(--border-color); backdrop-filter: blur(12px); padding: 16px 30px; display: flex; justify-content: center; gap: 12px; z-index: 40; flex-wrap: wrap; }
    .card { width: 92px; height: 138px; background: #fff; color: #0f172a; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 10px; font: 700 18px var(--font-mono); transition: 0.2s; position: relative; border: 2px solid transparent; }
    .card.red { color: var(--accent-danger); }
    .card:hover { transform: translateY(-8px); }
    .card.selected { transform: translateY(-16px); border-color: var(--accent-primary); box-shadow: 0 0 25px var(--accent-glow); }
    .card .tag { font: 600 9px var(--font-ui); background: #0f172a; color: #fff; padding: 4px 0; border-radius: 4px; text-align: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 88%; }
    .discard-dead-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent-danger); color: #fff; font: 700 10px var(--font-ui); border: none; padding: 8px 0; width: 90%; border-radius: 5px; z-index: 10; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6); cursor: pointer; }
    .discard-dead-btn:hover { filter: brightness(1.15); }
    
    /* Modals & Buttons */
    .btn-primary { background: var(--accent-primary); color: #060911; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 15px; transition: 0.2s; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35); }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(6, 9, 17, 0.9); display: grid; place-items: center; z-index: 1000; backdrop-filter: blur(8px); }
    .modal-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; text-align: center; max-width: 480px; width: 90%; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--accent-primary); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const app = document.querySelector('#app');
    const shareOrigin = location.hostname === 'localhost' ? 'http://192.168.1.128:3100' : location.origin;
    let state = { screen: 'home', mode: 'individual', max: 4, name: '', avatar: '🦊', room: null, player: null, game: null, selected: null };
    const avatars = ['🦊','🐼','🐯','🦉','🐸','🦁','🤖','👽'];
    
    // Web Audio Synthesizer
    let audioEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type = 'turn') {
        if (!audioEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'turn') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        } else {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function toast(t) {
        document.querySelector('.toast')?.remove();
        let d = document.createElement('div');
        d.className = 'toast';
        d.textContent = t;
        document.body.append(d);
        setTimeout(() => d.remove(), 3000);
    }
    
    async function api(url, data) {
        let r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        let j = await r.json();
        if (!r.ok) throw Error(j.error || 'Server request failed');
        return j;
    }

    function home() {
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-size: 12px; font-family: var(--font-mono); color: var(--accent-primary); letter-spacing: 0.2em; margin-bottom: 10px;">DIGITAL TABLETOP</div>
                <h1 style="font-size: 44px; margin: 0 0 10px 0; font-weight: 700; letter-spacing: 0.05em;">SEQUENCE</h1>
                <p style="color: var(--text-dim); margin-bottom: 30px; font-size: 14px;">Tactical card strategy for multiplayer tables.</p>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn-primary" onclick="playBeep('click'); setup()">CREATE GAME</button>
                    <button class="btn-primary" style="background: transparent; border: 1px solid var(--border-color); color: #fff;" onclick="playBeep('click'); join()">JOIN GAME</button>
                </div>
            </div>
        </div>`;
    }
    
    function setup() {
        state.screen = 'setup';
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <h2 style="margin-top:0; font-size:22px;">Match Configuration</h2>
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
                    <button class="btn-primary" style="flex:1; background:${state.mode==='individual'?'var(--accent-primary)':'transparent'}; color:${state.mode==='individual'?'#000':'#fff'}; border:1px solid var(--border-color);" onclick="playBeep('click'); state.mode='individual'; setup()">Individual</button>
                    <button class="btn-primary" style="flex:1; background:${state.mode==='team'?'var(--accent-primary)':'transparent'}; color:${state.mode==='team'?'#000':'#fff'}; border:1px solid var(--border-color);" onclick="playBeep('click'); state.mode='team'; setup()">Team Play</button>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;">
                    ${[2,3,4].map(n=>`<button class="btn-primary" style="flex:1; padding: 8px 0; background:${state.max===n?'var(--accent-primary)':'transparent'}; color:${state.max===n?'#000':'#fff'}; border:1px solid var(--border-color);" onclick="playBeep('click'); state.max=${n}; setup()">${n}P</button>`).join('')}
                </div>
                <div style="display: flex; justify-content: center; gap: 8px; font-size: 26px; margin-bottom: 20px;">
                    ${avatars.map(a=>`<span style="cursor:pointer; opacity:${a===state.avatar?1:0.4}; transform:scale(${a===state.avatar?1.2:1}); transition:0.2s;" onclick="playBeep('click'); state.avatar='${a}'; setup()">${a}</span>`).join('')}
                </div>
                <input id="name" class="chat-input" style="padding: 12px; margin-bottom: 16px; width: 100%; font-size: 15px;" placeholder="Your Call Sign" value="${esc(state.name)}">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" style="flex-grow: 1;" onclick="playBeep('click'); createGame()">HOST TABLE</button>
                    <button class="btn-primary" style="background: transparent; border: 1px solid var(--border-color); color: #fff;" onclick="playBeep('click'); home()">BACK</button>
                </div>
            </div>
        </div>`;
    }
    
    async function createGame() {
        state.name = document.querySelector('#name').value.trim() || 'Player';
        try {
            let x = await api('/api/create', { mode: state.mode, max: state.max, name: state.name, avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }
    
    function join() {
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <h2 style="margin-top:0; font-size:22px;">Join Table</h2>
                <input id="code" class="chat-input" style="padding: 12px; margin-bottom: 12px; width: 100%; text-transform:uppercase; font-family:var(--font-mono); font-size:16px; text-align:center; letter-spacing:0.1em;" placeholder="ROOM CODE">
                <input id="name" class="chat-input" style="padding: 12px; margin-bottom: 20px; width: 100%; font-size:15px;" placeholder="Your Call Sign">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" style="flex-grow: 1;" onclick="playBeep('click'); joinGame()">CONNECT</button>
                    <button class="btn-primary" style="background: transparent; border: 1px solid var(--border-color); color: #fff;" onclick="playBeep('click'); home()">BACK</button>
                </div>
            </div>
        </div>`;
    }
    
    async function joinGame() {
        try {
            let x = await api('/api/join', { room: document.querySelector('#code').value, name: document.querySelector('#name').value || 'Guest', avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }

    function connect() {
        state.es?.close();
        state.es = new EventSource(`/events?player=${state.player}`);
        let lastTurn = null;
        state.es.addEventListener('state', e => {
            state.game = JSON.parse(e.data);
            if (state.game.started && state.game.me && state.game.turn === state.game.me.id && lastTurn !== state.game.me.id) {
                playBeep('turn');
            }
            lastTurn = state.game.turn;
            if (state.game.started) game(); else lobby();
        });
    }
    
    function lobby() {
        let g = state.game || { code: state.room, players: [], max: state.max, host: state.player };
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-family:var(--font-mono); font-size:32px; letter-spacing:0.15em; color:var(--accent-primary); margin-bottom:6px;">${g.code}</div>
                <p style="color:var(--text-dim); margin-bottom:20px; font-size:13px;">Waiting for players to connect...</p>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
                    ${Array.from({length: g.max}, (_, i) => {
                        let p = g.players.find(q => q.seat === i);
                        return `<div style="background:rgba(0,0,0,0.3); padding:10px 14px; border-radius:8px; border-left:4px solid ${p?.color||'#334155'}; text-align:left; font-family:var(--font-mono); font-size:13px;">${p ? `${p.avatar} ${esc(p.name)}` : `Slot ${i+1} — Waiting...`}</div>`;
                    }).join('')}
                </div>
                <div style="display: flex; gap: 10px;">
                    ${g.host === state.player ? '<button class="btn-primary" style="flex-grow:1;" onclick="playBeep(\'click\'); start()">START MATCH</button>' : ''}
                    <button class="btn-primary" style="background:transparent; border:1px solid var(--border-color); color:#fff;" onclick="playBeep('click'); home()">LEAVE</button>
                </div>
            </div>
        </div>`;
    }
    
    async function start() {
        try { await api('/api/start', { room: state.room, player: state.player }); } catch(e) { toast(e.message); }
    }

    function cardDead(c, g) {
        return !c.jack && !g.board.some(x => !x.corner && !x.chip && x.rank === c.rank && x.suit === c.suit);
    }
    
    function sendChat() {
        let input = document.getElementById('chat-msg');
        if (input && input.value.trim() !== '') {
            playBeep('click');
            let log = document.getElementById('chat-log');
            if (log) {
                log.innerHTML += `<div>You: ${esc(input.value)}</div>`;
                log.scrollTop = log.scrollHeight;
            }
            input.value = '';
        }
    }

    function game() {
        let g = state.game, me = g.me;
        if (!me) return;
        let mine = g.turn === me.id;
        let selected = me.hand.find(c => c.id === state.selected);
        
        let legal = c => {
            if (!selected || !mine) return false;
            if (selected.eye === 'two') return !c.chip && !c.corner;
            if (selected.eye === 'one') return !!c.chip && !c.locked.length && c.chip !== me.id;
            return !c.chip && !c.corner && c.rank === selected.rank && c.suit === selected.suit;
        };
        
        app.innerHTML = `
        <div id="app">
            <header class="header">
                <div class="brand">SEQUENCE <span>· TABLE</span></div>
                <div class="status-pill">${mine ? 'YOUR TURN' : "OPPONENT'S TURN"}</div>
                <button class="btn-icon" onclick="playBeep('click'); audioEnabled=!audioEnabled; toast(audioEnabled?'Audio Enabled':'Audio Muted')">🔊 AUDIO</button>
            </header>

            <div class="workspace">
                <!-- Left Sidebar -->
                <div class="sidebar-left">
                    <div class="panel chat-box">
                        <div class="panel-title">Comms Link</div>
                        <div class="chat-messages" id="chat-log">
                            ${g.history.slice(-8).map(h => `<div>> ${esc(h.text)}</div>`).join('')}
                        </div>
                        <div class="chat-input-row">
                            <input id="chat-msg" class="chat-input" placeholder="Say something..." onkeypress="if(event.key==='Enter')sendChat()">
                            <button class="btn-icon" onclick="sendChat()">➤</button>
                        </div>
                    </div>
                </div>

                <!-- Center Board -->
                <div class="center-area">
                    <div class="board-container">
                        ${g.board.map(c => `
                            <div class="cell ${c.corner ? 'free' : ''} ${legal(c) ? 'legal' : ''}" onclick="cell(${c.x},${c.y})">
                                ${c.chip ? `<i class="chip" style="--c:${g.players.find(p=>p.id===c.chip)?.color}"></i>` : c.label || ''}
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div class="sidebar-right">
                    <div class="panel">
                        <div class="panel-title">Players</div>
                        ${g.players.map(p => `
                            <div class="player-card ${g.turn === p.id ? 'active' : ''}" style="--c:${p.color}">
                                <div class="player-dot"></div>
                                <div style="flex-grow:1;">
                                    <div style="font-weight:600; font-size:14px;">${p.avatar} ${esc(p.name)}</div>
                                    <div style="font-size:12px; color:var(--text-dim);">${p.handCount} cards · ${p.sequences} seq</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="panel">
                        <div class="panel-title">Table Piles</div>
                        <div class="piles-grid">
                            <div class="stack-box">
                                <div>DECK</div>
                                <div class="stack-val">${g.deckCount}</div>
                            </div>
                            <div class="stack-box">
                                <div>DISCARD</div>
                                <div class="stack-val" style="color:var(--accent-primary);">${g.discard?.label || '—'}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Hand Dock -->
            <div class="hand-dock">
                ${me.hand.map(c => {
                    let isDead = cardDead(c, g);
                    return `
                    <button class="card ${['♥','♦'].includes(c.suit) ? 'red' : ''} ${state.selected === c.id ? 'selected' : ''}" onclick="select('${c.id}')" ${!mine && !isDead ? 'disabled' : ''}>
                        <div style="line-height:1;">${c.label}</div>
                        ${c.eye ? `<div class="tag">${c.eye==='two'?'WILD':'SNIPE'}</div>` : ''}
                        ${isDead ? `<button class="discard-dead-btn" onclick="discardDead('${c.id}', event)">DISCARD DEAD</button>` : ''}
                        <div style="line-height:1; align-self:flex-end; transform:rotate(180deg);">${c.label}</div>
                    </button>
                `;}).join('')}
            </div>

            ${g.winner ? `
            <div class="modal-overlay">
                <div class="modal-card" style="border-color:var(--accent-primary);">
                    <div style="font-family:var(--font-mono); color:var(--accent-primary); margin-bottom:8px;">VICTORY ACHIEVED</div>
                    <h1 style="font-size:40px; margin:0 0 10px 0;">${esc(g.winner.name)}</h1>
                    <p style="color:var(--text-dim); margin-bottom:24px;">Has successfully completed the sequence grid.</p>
                    <button class="btn-primary" onclick="home()">NEW MATCH</button>
                </div>
            </div>` : ''}
        </div>`;
    }

    function select(cardId) {
        playBeep('click');
        if (state.selected === cardId) { state.selected = null; game(); return; }
        state.selected = cardId;
        game();
    }
    
    async function discardDead(cardId, event) {
        playBeep('click');
        if (event) event.stopPropagation();
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'dead', cardId } });
            state.selected = null;
        } catch(e) { toast(e.message); }
    }
    
    async function cell(x, y) {
        let c = state.game.me.hand.find(x => x.id === state.selected);
        if (!c) return;
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'play', cardId: c.id, x, y } });
            state.selected = null;
            playBeep('click');
        } catch(e) { toast(e.message); }
    }
    
    const roomParam = new URLSearchParams(location.search).get('room');
    if (roomParam) {
        join();
        setTimeout(() => document.querySelector('#code').value = roomParam.toUpperCase(), 0);
    } else {
        home();
    }
  </script>
</body>
</html>
