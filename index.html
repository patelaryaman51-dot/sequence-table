<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sequence - Digital Tabletop Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap');
    
    :root {
        --bg-space: #06110e;
        --circuit-glow: rgba(79, 209, 197, 0.08);
        --neon-teal: #4fd1c5;
        --neon-green: #38a169;
        --neon-red: #e53e3e;
        --neon-blue: #3182ce;
        --panel-bg: rgba(10, 25, 20, 0.75);
        --panel-border: rgba(79, 209, 197, 0.3);
        --text-main: #e2e8f0;
        --text-muted: #a0aec0;
        --font-ui: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }
    
    * { box-sizing: border-box; }
    
    body { 
        margin: 0; 
        background-color: var(--bg-space);
        background-image: 
            linear-gradient(var(--circuit-glow) 1px, transparent 1px),
            linear-gradient(90deg, var(--circuit-glow) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-main); 
        font-family: var(--font-ui); 
        overflow: hidden; 
        user-select: none; 
        height: 100vh;
        width: 100vw;
    }

    /* Background depth elements */
    .bg-card-float {
        position: absolute;
        width: 120px; height: 170px;
        background: #e2e8f0;
        border-radius: 8px;
        opacity: 0.05;
        filter: blur(4px);
        transform: rotate(-15deg);
        z-index: -1;
    }
    
    button, input { font: inherit; }
    button { cursor: pointer; outline: none; }
    
    #app { width: 100%; height: 100%; position: relative; }

    .header-banner {
        position: absolute;
        top: 20px; left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, rgba(10,25,20,0.9) 0%, rgba(20,50,40,0.9) 50%, rgba(10,25,20,0.9) 100%);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 10px 30px;
        display: flex;
        align-items: center;
        gap: 30px;
        box-shadow: 0 0 20px rgba(79, 209, 197, 0.15);
        z-index: 10;
        backdrop-filter: blur(10px);
    }
    .header-title { font-weight: 700; font-size: 14px; letter-spacing: 0.1em; color: #fff; text-transform: uppercase; }
    .header-turn { font-size: 12px; font-weight: 600; color: var(--neon-teal); padding: 4px 12px; border-radius: 12px; background: rgba(79, 209, 197, 0.1); }

    .top-right-audio {
        position: absolute;
        top: 20px; right: 20px;
        background: var(--panel-bg);
        border: 1px solid var(--neon-teal);
        border-radius: 12px;
        padding: 16px 24px;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(79, 209, 197, 0.2);
        z-index: 10;
        min-width: 220px;
    }
    .audio-title { font-weight: 800; font-size: 16px; color: var(--neon-teal); margin-bottom: 8px; text-transform: uppercase; }
    .audio-icon-box { font-size: 32px; color: var(--neon-teal); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .audio-icon-box:hover { text-shadow: 0 0 15px var(--neon-teal); }
    .audio-status { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    .players-panel {
        position: absolute;
        top: 130px; right: 20px;
        width: 220px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .players-header { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.1em; }
    .player-row {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 12px;
        backdrop-filter: blur(10px);
        position: relative;
    }
    .player-row.active { border-color: var(--neon-teal); box-shadow: inset 0 0 10px rgba(79,209,197,0.2); }
    .player-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; color: #fff; }
    .player-icon { font-size: 12px; }
    .player-stats { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .current-turn-tag { font-size: 10px; font-weight: 700; color: var(--neon-teal); margin-top: 4px; letter-spacing: 0.05em; }

    .chat-panel {
        position: absolute;
        bottom: 20px; left: 20px;
        width: 250px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(10px);
        z-index: 10;
        overflow: hidden;
    }
    .chat-header { padding: 8px 16px; font-size: 11px; font-weight: 700; border-bottom: 1px solid var(--panel-border); color: var(--text-muted); letter-spacing: 0.05em; }
    .chat-messages { height: 140px; overflow-y: auto; padding: 12px 16px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { line-height: 1.4; }
    .chat-msg span { font-weight: 700; color: var(--neon-blue); }
    .chat-inputs { padding: 12px 16px; border-top: 1px solid var(--panel-border); background: rgba(0,0,0,0.3); }
    .emoji-row { display: flex; gap: 10px; margin-bottom: 8px; font-size: 16px; }
    .emoji-row span { cursor: pointer; transition: transform 0.1s; }
    .emoji-row span:hover { transform: scale(1.2); }
    .input-bar { display: flex; gap: 8px; }
    .chat-input { flex-grow: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px 12px; color: #fff; outline: none; font-size: 13px; }
    .chat-input:focus { border-color: var(--neon-teal); }
    .chat-send { background: var(--neon-teal); border: none; border-radius: 6px; padding: 0 12px; color: #000; font-weight: 800; }

    .decks-panel {
        position: absolute;
        bottom: 20px; right: 20px;
        display: flex;
        gap: 15px;
        z-index: 10;
    }
    .deck-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .deck-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .deck-card { 
        width: 80px; height: 115px; 
        background: #e2e8f0; 
        border-radius: 8px; 
        border: 2px solid #cbd5e1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: var(--font-mono); font-weight: 800; font-size: 24px; color: #1a202c;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        position: relative;
    }
    .deck-card.dead-graphic { background: #1a202c; border-color: #4a5568; color: #718096; font-size: 14px; text-align: center; padding: 10px; }
    .deck-card.dead-graphic .red-x { color: var(--neon-red); font-size: 40px; position: absolute; font-weight: 400; opacity: 0.7; }

    .board-container {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: min(85vh, 850px);
        aspect-ratio: 1;
        background: #e2e8f0;
        border: 6px solid var(--neon-teal);
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(79, 209, 197, 0.2), 0 30px 60px rgba(0,0,0,0.8);
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
        overflow: hidden;
        z-index: 5;
    }
    
    .cell {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        border-right: 1px solid #cbd5e1;
        border-bottom: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #1a202c;
        font: 800 clamp(14px, 2.5vh, 26px) var(--font-mono);
        transition: 0.15s;
    }
    .cell.red-suit { color: var(--neon-red); }
    .cell:nth-child(odd) { background: #ffffff; }
    .cell.free { background: var(--bg-space); color: var(--neon-teal); font-size: clamp(10px, 1.5vh, 16px); flex-direction: column; border: 1px solid var(--neon-teal); }
    .cell.free::after { content: 'FREE'; margin-top: 4px; }
    .cell.legal:hover { background: rgba(79, 209, 197, 0.2); cursor: pointer; box-shadow: inset 0 0 0 3px var(--neon-teal); z-index: 5; }
    
    .chip { 
        width: 75%; height: 75%; 
        border-radius: 50%; 
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, var(--c) 50%, #000000 100%); 
        border: 2px solid rgba(255,255,255,0.4); 
        box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.5); 
        position: absolute; 
    }

    .hand-panel {
        position: absolute;
        top: 20px; left: 20px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        width: 250px;
        gap: 12px;
        z-index: 10;
        background: var(--panel-bg);
        padding: 15px;
        border-radius: 16px;
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(10px);
        max-height: calc(100vh - 300px);
        overflow-y: auto;
    }
    
    .card {
        width: 90px; height: 130px;
        background: #ffffff;
        color: #1a202c;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 8px;
        font: 800 18px var(--font-mono);
        border: 2px solid transparent;
        transition: 0.2s;
        position: relative;
    }
    .card.red { color: var(--neon-red); }
    .card:hover:not(:disabled) { transform: scale(1.05); cursor: pointer; z-index: 2; }
    .card.selected { transform: scale(1.05); border-color: var(--neon-teal); box-shadow: 0 0 25px rgba(79, 209, 197, 0.4); z-index: 2; }
    .card:disabled { opacity: 0.5; filter: grayscale(1); }
    .card .tag { font: 700 10px var(--font-ui); background: #1a202c; color: #fff; padding: 4px 0; border-radius: 4px; text-align: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; }
    
    .dead-watermark {
        position: absolute; inset: 0;
        background: rgba(0,0,0,0.6);
        border-radius: 6px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 5;
    }
    .dead-watermark span { color: var(--neon-red); font-size: 50px; font-weight: 400; opacity: 0.4; position: absolute; }
    .discard-dead-btn { 
        background: var(--neon-red); color: #fff; font: 800 11px var(--font-ui); 
        border: none; padding: 10px 0; width: 90%; border-radius: 6px; 
        z-index: 10; box-shadow: 0 6px 15px rgba(229, 62, 62, 0.5); cursor: pointer; transition: 0.15s; 
    }
    .discard-dead-btn:hover { background: #f56565; transform: scale(1.05); }

    /* Lobby & Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: grid; place-items: center; z-index: 1000; backdrop-filter: blur(15px); }
    .modal-card { background: var(--bg-space); border: 1px solid var(--neon-teal); border-radius: 20px; padding: 40px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 0 50px rgba(79, 209, 197, 0.15); }
    .btn-primary { background: var(--neon-teal); color: #000; border: none; padding: 14px 28px; border-radius: 10px; font-weight: 800; font-size: 15px; transition: 0.2s; box-shadow: 0 0 20px rgba(79, 209, 197, 0.3); text-transform: uppercase; width: 100%; margin-top: 12px; }
    .btn-primary:hover { filter: brightness(1.2); box-shadow: 0 0 30px rgba(79, 209, 197, 0.5); }
    .form-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 8px; padding: 14px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
    .form-input:focus { border-color: var(--neon-teal); }
    .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: var(--bg-space); border: 1px solid var(--neon-teal); color: var(--text-main); padding: 12px 24px; border-radius: 8px; font-weight: 600; box-shadow: 0 0 20px rgba(79, 209, 197, 0.2); z-index: 2000; }
  </style>
</head>
<body>
  <!-- Background Depth Shapes -->
  <div class="bg-card-float" style="top: 15%; left: 10%;"></div>
  <div class="bg-card-float" style="top: 60%; left: 5%; transform: rotate(25deg);"></div>
  <div class="bg-card-float" style="top: 20%; right: 8%; transform: rotate(-35deg);"></div>
  <div class="bg-card-float" style="bottom: 15%; right: 12%; transform: rotate(15deg);"></div>

  <div id="app"></div>

  <script>
    const app = document.querySelector('#app');
    let state = { screen: 'home', mode: 'individual', max: 4, name: '', avatar: '👽', room: null, player: null, game: null, selected: null };
    const avatars = ['👽','🤖','👾','👻','🦊','🐼'];
    
    let audioEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function toggleAudio() {
        audioEnabled = !audioEnabled;
        playBeep('click');
        if(state.game) game();
    }

    function playBeep(type = 'turn') {
        if (!audioEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'turn') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); // A5
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function toast(t) {
        document.querySelector('.toast')?.remove();
        let d = document.createElement('div');
        d.className = 'toast';
        d.textContent = t;
        document.body.append(d);
        setTimeout(() => d.remove(), 3000);
    }
    
    async function api(url, data) {
        let r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        let j = await r.json();
        if (!r.ok) throw Error(j.error || 'Server request failed');
        return j;
    }

    function home() {
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-size: 12px; color: var(--neon-teal); letter-spacing: 0.2em; margin-bottom: 10px; font-weight: 700;">DIGITAL TABLETOP EDITION</div>
                <h1 style="font-size: 48px; margin: 0 0 20px 0; font-weight: 800; letter-spacing: 0.05em; font-family: var(--font-mono);">SEQUENCE</h1>
                <button class="btn-primary" onclick="playBeep('click'); setup()">CREATE GAME</button>
                <button class="btn-primary" style="background: transparent; border: 1px solid var(--neon-teal); color: var(--neon-teal);" onclick="playBeep('click'); join()">JOIN ROOM</button>
            </div>
        </div>`;
    }
    
    function setup() {
        state.screen = 'setup';
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <h2 style="margin-top:0; font-size:24px; font-weight: 800;">CONFIGURE MATCH</h2>
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
                    <button class="btn-primary" style="margin-top:0; background:${state.mode==='individual'?'var(--neon-teal)':'transparent'}; color:${state.mode==='individual'?'#000':'var(--text-main)'}; border:1px solid var(--neon-teal);" onclick="playBeep('click'); state.mode='individual'; setup()">INDIVIDUAL</button>
                    <button class="btn-primary" style="margin-top:0; background:${state.mode==='team'?'var(--neon-teal)':'transparent'}; color:${state.mode==='team'?'#000':'var(--text-main)'}; border:1px solid var(--neon-teal);" onclick="playBeep('click'); state.mode='team'; setup()">TEAM</button>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;">
                    ${[2,3,4].map(n=>`<button class="btn-primary" style="margin-top:0; padding: 10px 0; background:${state.max===n?'var(--neon-teal)':'transparent'}; color:${state.max===n?'#000':'var(--text-main)'}; border:1px solid var(--neon-teal);" onclick="playBeep('click'); state.max=${n}; setup()">${n}P</button>`).join('')}
                </div>
                <div style="display: flex; justify-content: center; gap: 15px; font-size: 32px; margin-bottom: 24px;">
                    ${avatars.map(a=>`<span style="cursor:pointer; opacity:${a===state.avatar?1:0.3}; transform:scale(${a===state.avatar?1.2:1}); transition:0.2s;" onclick="playBeep('click'); state.avatar='${a}'; setup()">${a}</span>`).join('')}
                </div>
                <input id="name" class="form-input" placeholder="Enter Callsign" value="${esc(state.name)}">
                <button class="btn-primary" onclick="playBeep('click'); createGame()">INITIALIZE TABLE</button>
            </div>
        </div>`;
    }
    
    async function createGame() {
        state.name = document.querySelector('#name').value.trim() || 'Player';
        try {
            let x = await api('/api/create', { mode: state.mode, max: state.max, name: state.name, avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }
    
    function join() {
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <h2 style="margin-top:0; font-size:24px; font-weight:800;">JOIN LINK</h2>
                <input id="code" class="form-input" style="text-transform:uppercase; font-family:var(--font-mono); font-size:20px; text-align:center; letter-spacing:0.1em;" placeholder="ROOM CODE">
                <input id="name" class="form-input" placeholder="Enter Callsign">
                <button class="btn-primary" onclick="playBeep('click'); joinGame()">CONNECT</button>
                <button class="btn-primary" style="background: transparent; border: 1px solid var(--neon-teal); color: var(--neon-teal);" onclick="playBeep('click'); home()">ABORT</button>
            </div>
        </div>`;
    }
    
    async function joinGame() {
        try {
            let x = await api('/api/join', { room: document.querySelector('#code').value, name: document.querySelector('#name').value || 'Guest', avatar: state.avatar });
            state.room = x.room; state.player = x.player; lobby(); connect();
        } catch(e) { toast(e.message); }
    }

    function connect() {
        state.es?.close();
        state.es = new EventSource(`/events?player=${state.player}`);
        let lastTurn = null;
        state.es.addEventListener('state', e => {
            state.game = JSON.parse(e.data);
            if (state.game.started && state.game.me && state.game.turn === state.game.me.id && lastTurn !== state.game.me.id) {
                playBeep('turn');
            }
            lastTurn = state.game.turn;
            if (state.game.started) game(); else lobby();
        });
    }
    
    function lobby() {
        let g = state.game || { code: state.room, players: [], max: state.max, host: state.player };
        let inviteLink = window.location.origin + '/?room=' + g.code;
        app.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-family:var(--font-mono); font-size:42px; font-weight:800; color:var(--neon-teal); margin-bottom:10px;">${g.code}</div>
                <p style="color:var(--text-muted); margin-bottom:20px;">Awaiting network connections...</p>
                
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
                    ${Array.from({length: g.max}, (_, i) => {
                        let p = g.players.find(q => q.seat === i);
                        return `<div style="background:rgba(0,0,0,0.5); padding:12px 16px; border-radius:8px; border-left:4px solid ${p?.color||'#4a5568'}; text-align:left; font-size:14px; font-weight:600;">${p ? `${p.avatar} ${esc(p.name)}` : `Slot ${i+1} — Empty`}</div>`;
                    }).join('')}
                </div>
                
                <button class="btn-primary" style="background:transparent; border:1px solid var(--neon-teal); color:var(--neon-teal); margin-top:0; margin-bottom:12px;" onclick="navigator.clipboard.writeText('${inviteLink}');toast('Invite link copied!')">COPY ROOM LINK</button>
                ${g.host === state.player ? '<button class="btn-primary" style="margin-top:0;" onclick="playBeep(\'click\'); start()">COMMENCE GAME</button>' : ''}
            </div>
        </div>`;
    }
    
    async function start() {
        try { await api('/api/start', { room: state.room, player: state.player }); } catch(e) { toast(e.message); }
    }

    // A card is dead ONLY IF both of its board spaces are occupied by a chip.
    function cardDead(c, g) {
        if(c.jack) return false; // Jacks are never dead.
        const spaces = g.board.filter(x => !x.corner && x.rank === c.rank && x.suit === c.suit);
        // If there are spaces on the board matching this card, and NONE of them are empty (!chip), it's dead.
        return spaces.length > 0 && spaces.every(x => x.chip !== null);
    }

    function sendChat() {
        let input = document.getElementById('chat-msg');
        if (input && input.value.trim() !== '') {
            playBeep('click');
            // Assuming history acts as a general log right now, ideally backend supports distinct chat.
            // For now, we simulate UI visual as requested by injecting locally to the log for demo.
            let log = document.getElementById('chat-log');
            if (log) {
                log.innerHTML += `<div class="chat-msg"><span>${state.game.me.name}:</span> ${esc(input.value)}</div>`;
                log.scrollTop = log.scrollHeight;
            }
            input.value = '';
        }
    }
    
    function insertEmoji(emoji) {
        let input = document.getElementById('chat-msg');
        if(input) input.value += emoji;
    }

    function game() {
        let g = state.game, me = g.me;
        if (!me) return;
        let mine = g.turn === me.id;
        let selected = me.hand.find(c => c.id === state.selected);
        let turnPlayer = g.players.find(p => p.id === g.turn) || { name: 'Someone' };
        
        let legal = c => {
            if (!selected || !mine) return false;
            if (selected.eye === 'two') return !c.chip && !c.corner;
            if (selected.eye === 'one') return !!c.chip && !c.locked.length && c.chip !== me.id;
            return !c.chip && !c.corner && c.rank === selected.rank && c.suit === selected.suit;
        };
        
        let lastPlayed = g.discard ? `<div style="color:${['♥','♦'].includes(g.discard.suit)?'var(--neon-red)':'#1a202c'}">${g.discard.label}</div>` : '';
        let lastDead = g.deadCard ? `<div style="color:${['♥','♦'].includes(g.deadCard.suit)?'var(--neon-red)':'#1a202c'}">${g.deadCard.label}</div>` : '';

        app.innerHTML = `
        <div class="header-banner">
            <div class="header-title">SEQUENCE · DIGITAL TABLETOP EDITION</div>
            <div class="header-turn">${mine ? 'YOUR TURN' : 'WAITING'}</div>
        </div>

        <div class="top-right-audio">
            <div class="audio-title">IT'S ${esc(turnPlayer.name).toUpperCase()}'S TURN!</div>
            <div class="audio-icon-box" onclick="toggleAudio()">
                ${audioEnabled ? '🔊' : '🔇'}
            </div>
            <div class="audio-status">${audioEnabled ? 'Speak (Audio Active)' : 'Audio Muted'}</div>
        </div>

        <div class="players-panel">
            <div class="players-header">PLAYERS</div>
            ${g.players.map(p => {
                // Determine icon based on suit color for visual flair
                let pIcon = ['#e53e3e'].includes(p.color) ? '♦' : '♠'; 
                return `
                <div class="player-row ${g.turn === p.id ? 'active' : ''}">
                    <div class="player-name" style="color:${p.color}">
                        <span class="player-icon">${pIcon}</span> ${esc(p.name)}
                    </div>
                    <div class="player-stats">${p.handCount} cards - ${p.sequences} sequences</div>
                    ${g.turn === p.id ? `<div class="current-turn-tag">CURRENT TURN</div>` : ''}
                </div>
            `;}).join('')}
        </div>

        <div class="chat-panel">
            <div class="chat-header">CHAT</div>
            <div class="chat-messages" id="chat-log">
                ${g.history.slice(-8).map(h => `<div class="chat-msg">> ${esc(h.text)}</div>`).join('')}
            </div>
            <div class="chat-inputs">
                <div class="emoji-row">
                    ${['😁','❤️','😍','😂','😊','🙏','👍'].map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('')}
                </div>
                <div class="input-bar">
                    <input id="chat-msg" class="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button class="chat-send" onclick="sendChat()">➤</button>
                </div>
            </div>
        </div>

        <div class="decks-panel">
            <div class="deck-slot">
                <div class="deck-title">DRAN DECK<br>(${g.deckCount} remaining)</div>
                <div class="deck-card">
                    <div style="font-size:12px; position:absolute; top:4px; left:4px;">A♠</div>
                    <span style="font-size:40px;">♣</span>
                </div>
            </div>
            <div class="deck-slot">
                <div class="deck-title">DISCARD PILE<br>(${g.discardCount})</div>
                <div class="deck-card dead-graphic">
                    ${lastPlayed || '<span style="font-size:12px">EMPTY</span>'}
                </div>
            </div>
            <div class="deck-slot">
                <div class="deck-title">DEAD CARD PILE<br>(${g.deadPileCount})</div>
                <div class="deck-card dead-graphic">
                    ${lastDead || '<span style="font-size:12px">EMPTY</span>'}
                    ${lastDead ? '<span class="red-x">X</span>' : ''}
                </div>
            </div>
        </div>

        <div class="board-container">
            ${g.board.map(c => `
                <div class="cell ${c.corner ? 'free' : ''} ${['♥','♦'].includes(c.suit) ? 'red-suit' : ''} ${legal(c) ? 'legal' : ''}" onclick="cell(${c.x},${c.y})">
                    ${c.chip ? `<i class="chip" style="--c:${g.players.find(p=>p.id===c.chip)?.color}"></i>` : c.label || ''}
                </div>
            `).join('')}
        </div>

        <div class="hand-panel">
            <div style="width: 100%; font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 5px;">YOUR HAND</div>
            ${me.hand.map(c => {
                let isDead = cardDead(c, g);
                let isRed = ['♥','♦'].includes(c.suit);
                return `
                <button class="card ${isRed ? 'red' : ''} ${state.selected === c.id ? 'selected' : ''}" onclick="select('${c.id}')" ${!mine && !isDead ? 'disabled' : ''}>
                    <div style="line-height:1; text-align:left;">${c.label}</div>
                    ${c.eye ? `<div class="tag">${c.eye==='two'?'WILD':'REMOVE'}</div>` : ''}
                    
                    ${isDead ? `
                        <div class="dead-watermark">
                            <span>X</span>
                            <button class="discard-dead-btn" onclick="discardDead('${c.id}', event)">DISCARD DEAD</button>
                        </div>
                    ` : ''}
                    
                    <div style="line-height:1; align-self:flex-end; transform:rotate(180deg);">${c.label}</div>
                </button>
            `;}).join('')}
        </div>

        ${g.winner ? `
        <div class="modal-overlay">
            <div class="modal-card">
                <div style="font-family:var(--font-mono); color:var(--neon-teal); margin-bottom:10px;">VICTORY DETECTED</div>
                <h1 style="font-size:40px; margin:0 0 10px 0;">${esc(g.winner.name)}</h1>
                <p style="color:var(--text-muted); margin-bottom:24px;">Sequence pattern completion achieved.</p>
                <button class="btn-primary" onclick="playBeep('click'); home()">NEW MATCH</button>
            </div>
        </div>` : ''}
        `;
    }

    function select(cardId) {
        playBeep('click');
        if (state.selected === cardId) { state.selected = null; game(); return; }
        state.selected = cardId;
        game();
    }
    
    async function discardDead(cardId, event) {
        playBeep('click');
        if (event) event.stopPropagation();
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'dead', cardId } });
            state.selected = null;
        } catch(e) { toast(e.message); }
    }
    
    async function cell(x, y) {
        let c = state.game.me.hand.find(x => x.id === state.selected);
        if (!c) return;
        try {
            await api('/api/action', { room: state.room, player: state.player, action: { type: 'play', cardId: c.id, x, y } });
            state.selected = null;
            playBeep('click');
        } catch(e) { toast(e.message); }
    }
    
    const roomParam = new URLSearchParams(location.search).get('room');
    if (roomParam) {
        join();
        setTimeout(() => document.querySelector('#code').value = roomParam.toUpperCase(), 0);
    } else {
        home();
    }
  </script>
</body>
</html>
